<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器标识 (User-Agent) 检测工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 750px;
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #1a1a1a;
            text-align: center;
        }
        .section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .ua-box {
            background-color: #f0f4f8;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            word-break: break-all;
            color: #0969da;
            line-height: 1.5;
            position: relative;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 15px;
        }
        .card-label {
            font-size: 12px;
            color: #57606a;
            margin-bottom: 5px;
        }
        .card-value {
            font-size: 16px;
            font-weight: 600;
            color: #24292f;
        }
        .btn-copy {
            margin-top: 10px;
            background-color: #2da44e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-copy:hover {
            background-color: #2c974b;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-yes { background-color: #dafbe1; color: #1a7f37; }
        .status-no { background-color: #ffebe9; color: #cf222e; }
    </style>
</head>
<body>

<div class="container">
    <h1>浏览器标识 (User-Agent) 检测</h1>

    <!-- 原始 UA 展示 -->
    <div class="section">
        <div class="section-title">原始 User-Agent 字符串</div>
        <div class="ua-box" id="ua-string">正在获取...</div>
        <button class="btn-copy" onclick="copyUA()">复制 UA 字符串</button>
    </div>

    <!-- 解析后的关键信息 -->
    <div class="section">
        <div class="section-title">解析结果</div>
        <div class="grid">
            <div class="card">
                <div class="card-label">浏览器名称</div>
                <div class="card-value" id="browser-name">-</div>
            </div>
            <div class="card">
                <div class="card-label">浏览器版本</div>
                <div class="card-value" id="browser-version">-</div>
            </div>
            <div class="card">
                <div class="card-label">操作系统</div>
                <div class="card-value" id="os-name">-</div>
            </div>
            <div class="card">
                <div class="card-label">渲染引擎</div>
                <div class="card-value" id="engine-name">-</div>
            </div>
        </div>
    </div>

    <!-- 浏览器特性检测 -->
    <div class="section">
        <div class="section-title">环境与特性</div>
        <div class="grid">
            <div class="card">
                <div class="card-label">设备类型</div>
                <div class="card-value" id="device-type">-</div>
            </div>
            <div class="card">
                <div class="card-label">屏幕分辨率</div>
                <div class="card-value" id="screen-size">-</div>
            </div>
            <div class="card">
                <div class="card-label">Cookie 支持</div>
                <div class="card-value" id="cookie-status">-</div>
            </div>
            <div class="card">
                <div class="card-label">触控支持</div>
                <div class="card-value" id="touch-status">-</div>
            </div>
        </div>
    </div>
</div>

<script>
    const ua = navigator.userAgent;

    // 显示原始 UA
    document.getElementById('ua-string').innerText = ua;

    // 解析浏览器和操作系统逻辑
    function parseUA(uaString) {
        let browser = "未知浏览器";
        let version = "未知版本";
        let os = "未知操作系统";
        let engine = "未知内核";

        // 1. 检测操作系统
        if (/windows nt 10.0/i.test(uaString)) os = "Windows 10 / 11";
        else if (/windows nt 6.3/i.test(uaString)) os = "Windows 8.1";
        else if (/windows nt 6.1/i.test(uaString)) os = "Windows 7";
        else if (/mac os x/i.test(uaString)) {
            if (/iphone|ipad|ipod/i.test(uaString)) os = "iOS";
            else os = "macOS";
        }
        else if (/android/i.test(uaString)) os = "Android";
        else if (/linux/i.test(uaString)) os = "Linux";

        // 2. 检测渲染引擎
        if (/applewebkit/i.test(uaString)) engine = "WebKit";
        if (/gecko/i.test(uaString) && !/webkit/i.test(uaString)) engine = "Gecko";
        if (/trident/i.test(uaString)) engine = "Trident";

        // 3. 检测浏览器名称及版本 (注意匹配顺序)
        let match;
        if ((match = uaString.match(/(edg|edge)\/([\d.]+)/i))) {
            browser = "Microsoft Edge";
            version = match[2];
        } else if ((match = uaString.match(/opr\/([\d.]+)/i)) || (match = uaString.match(/opera\/([\d.]+)/i))) {
            browser = "Opera";
            version = match[1];
        } else if ((match = uaString.match(/chrome\/([\d.]+)/i))) {
            browser = "Google Chrome (或基于 Chromium)";
            version = match[1];
        } else if ((match = uaString.match(/version\/([\d.]+).*safari/i))) {
            browser = "Safari";
            version = match[1];
        } else if ((match = uaString.match(/firefox\/([\d.]+)/i))) {
            browser = "Firefox";
            version = match[1];
        } else if ((match = uaString.match(/msie ([\d.]+)/i)) || (match = uaString.match(/rv:([\d.]+)\) like gecko/i))) {
            browser = "Internet Explorer";
            version = match[1];
        }

        return { browser, version, os, engine };
    }

    // 执行解析并渲染到界面
    const result = parseUA(ua);
    document.getElementById('browser-name').innerText = result.browser;
    document.getElementById('browser-version').innerText = result.version;
    document.getElementById('os-name').innerText = result.os;
    document.getElementById('engine-name').innerText = result.engine;

    // 设备及特性检测
    const isMobile = /mobile|android|iphone|ipad|ipod/i.test(ua);
    document.getElementById('device-type').innerText = isMobile ? "移动设备" : "桌面设备";
    
    document.getElementById('screen-size').innerText = `${window.screen.width} x ${window.screen.height}`;
    
    const cookieEnabled = navigator.cookieEnabled;
    document.getElementById('cookie-status').innerHTML = cookieEnabled 
        ? '<span class="status-badge status-yes">已启用</span>' 
        : '<span class="status-badge status-no">已禁用</span>';

    const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    document.getElementById('touch-status').innerHTML = hasTouch 
        ? '<span class="status-badge status-yes">支持</span>' 
        : '<span class="status-badge status-no">不支持</span>';

    // 复制功能
    function copyUA() {
        navigator.clipboard.writeText(ua).then(() => {
            alert('UA 字符串已复制到剪贴板！');
        }).catch(err => {
            alert('复制失败，请手动复制。');
        });
    }
</script>

</body>
</html>
