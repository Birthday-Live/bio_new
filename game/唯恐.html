<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>唯 恐</title>
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Georgia','STSong','SimSun',serif;color:#b0a090;user-select:none}

/* ===== CRT 屏幕效果 ===== */
#screen{
    position:relative;width:100vw;height:100vh;overflow:hidden;
    background:radial-gradient(ellipse at center,#0a0a0a 0%,#050505 70%,#000 100%);
    box-shadow:inset 0 0 120px rgba(0,0,0,.9);
}
#screen::before{
    content:'';position:absolute;inset:0;z-index:999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);
    pointer-events:none;
}
#screen::after{
    content:'';position:absolute;inset:0;z-index:999;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%);
    pointer-events:none;
}

/* ===== 扫描线动画 ===== */
@keyframes scanline{
    0%{top:-5%}
    100%{top:105%}
}
.scanline{
    position:absolute;inset:0;z-index:998;
    background:linear-gradient(transparent 50%,rgba(0,0,0,.03) 50%);
    background-size:100% 4px;
    pointer-events:none;
    animation:scanline 8s linear infinite;
}

/* ===== 闪烁/噪点 ===== */
@keyframes flicker{
    0%,100%{opacity:1}
    92%{opacity:1}
    93%{opacity:.6}
    94%{opacity:.8}
    96%{opacity:.3}
    97%{opacity:.9}
}
.flicker{animation:flicker .15s infinite;}

/* ===== 主容器 ===== */
#game-container{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;padding:20px 20px 10px;
    max-width:800px;margin:0 auto;width:100%;
}
/* ===== 顶部信息栏 ===== */
#header{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 16px;border-bottom:1px solid rgba(180,160,140,.2);
    font-size:13px;color:#706050;letter-spacing:2px;flex-shrink:0;
}
#header .title{font-size:18px;color:#b0a090;letter-spacing:8px;text-shadow:0 0 10px rgba(180,160,140,.3);}
#sanity-bar{display:flex;align-items:center;gap:8px;}
#sanity-fill{
    width:100px;height:4px;background:rgba(180,160,140,.1);border-radius:2px;overflow:hidden;position:relative;
}
#sanity-fill span{
    display:block;height:100%;border-radius:2px;transition:width .8s ease,background .8s ease;
    background:linear-gradient(90deg,#8a7a6a,#b0a090);
}
#inventory{
    display:flex;gap:6px;align-items:center;flex-shrink:0;
    padding:8px 0;min-height:40px;border-bottom:1px solid rgba(180,160,140,.08);
    margin-bottom:8px;overflow-x:auto;
}
#inventory .label{font-size:11px;color:#605040;letter-spacing:1px;margin-right:8px;}
#inventory .slot{
    width:32px;height:32px;border:1px solid rgba(180,160,140,.15);border-radius:3px;
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
    background:rgba(0,0,0,.4);transition:border-color .3s;
}
#inventory .slot.has{ border-color:rgba(180,160,140,.4); }

/* ===== 场景区 ===== */
#scene{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:10px 0;overflow-y:auto;position:relative;min-height:0;
}
#scene::-webkit-scrollbar{width:2px;}
#scene::-webkit-scrollbar-thumb{background:rgba(180,160,140,.2);border-radius:1px;}

#scene-title{
    font-size:14px;color:#706050;letter-spacing:6px;margin-bottom:12px;
    text-transform:uppercase;border-left:2px solid rgba(180,160,140,.3);padding-left:12px;
}
#scene-desc{
    line-height:1.9;font-size:15px;color:#c0b0a0;margin-bottom:16px;
    text-shadow:0 0 20px rgba(180,160,140,.05);
}
#scene-desc .glitch{
    animation:glitchText .3s ease 3;
    color:#d0c0b0;
}
@keyframes glitchText{
    0%{transform:translate(0,0);opacity:1}
    20%{transform:translate(-2px,1px);opacity:.8;color:#a08070}
    40%{transform:translate(2px,-1px)}
    60%{transform:translate(-1px,0);color:#c09080}
    80%{transform:translate(1px,1px)}
    100%{transform:translate(0,0);opacity:1}
}

/* ===== 互动项 ===== */
#interactions{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:10px;
}
#interactions .btn{
    padding:7px 18px;font-size:13px;font-family:inherit;letter-spacing:1px;
    background:rgba(180,160,140,.06);border:1px solid rgba(180,160,140,.2);border-radius:3px;
    color:#b0a090;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden;
}
#interactions .btn:hover{
    background:rgba(180,160,140,.15);border-color:rgba(180,160,140,.4);
    color:#d0c0b0;text-shadow:0 0 8px rgba(180,160,140,.3);
}
#interactions .btn:active{transform:scale(.97)}
#interactions .btn.disabled{
    opacity:.3;cursor:not-allowed;pointer-events:none;
}
#interactions .btn .hint{
    font-size:10px;color:#605040;display:block;margin-top:2px;letter-spacing:0;
}

/* ===== 底部导航 ===== */
#nav{
    display:flex;gap:8px;flex-shrink:0;padding:8px 0 0;
    border-top:1px solid rgba(180,160,140,.08);margin-top:8px;
    justify-content:center;flex-wrap:wrap;
}
#nav .btn{
    padding:5px 14px;font-size:12px;font-family:inherit;letter-spacing:2px;
    background:transparent;border:1px solid rgba(180,160,140,.12);border-radius:3px;
    color:#706050;cursor:pointer;transition:all .3s ease;
}
#nav .btn:hover{
    border-color:rgba(180,160,140,.3);color:#b0a090;
}
#nav .btn.active{
    border-color:rgba(180,160,140,.4);color:#d0c0b0;background:rgba(180,160,140,.08);
}

/* ===== 对话/弹窗 ===== */
#overlay{
    position:absolute;inset:0;z-index:100;
    display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.85);backdrop-filter:blur(4px);
}
#overlay.show{display:flex}
#overlay-box{
    max-width:500px;width:90%;padding:30px;border:1px solid rgba(180,160,140,.15);
    background:rgba(10,10,10,.95);border-radius:4px;
    max-height:70vh;overflow-y:auto;
}
#overlay-box h2{font-size:16px;color:#b0a090;letter-spacing:4px;margin-bottom:14px;font-weight:normal;}
#overlay-box p{font-size:14px;line-height:1.9;color:#b0a090;margin-bottom:14px;}
#overlay-box .btn{
    padding:7px 24px;font-size:13px;font-family:inherit;letter-spacing:2px;
    background:rgba(180,160,140,.1);border:1px solid rgba(180,160,140,.3);border-radius:3px;
    color:#b0a090;cursor:pointer;transition:all .3s;margin-top:8px;
}
#overlay-box .btn:hover{background:rgba(180,160,140,.2);}

/* ===== 结束界面 ===== */
#ending-screen{
    position:absolute;inset:0;z-index:200;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px;
}
#ending-screen.show{display:flex}
#ending-screen h1{
    font-size:28px;letter-spacing:12px;margin-bottom:20px;font-weight:normal;
}
#ending-screen p{
    font-size:15px;line-height:2;color:#b0a090;max-width:400px;margin-bottom:24px;
}
#ending-screen .btn{
    padding:8px 28px;font-size:14px;font-family:inherit;letter-spacing:3px;
    background:rgba(180,160,140,.1);border:1px solid rgba(180,160,140,.3);border-radius:3px;
    color:#b0a090;cursor:pointer;transition:all .3s;
}
#ending-screen .btn:hover{background:rgba(180,160,140,.2);}
.ending-red h1{color:#a06050;text-shadow:0 0 20px rgba(160,96,80,.3);}
.ending-blue h1{color:#506080;text-shadow:0 0 20px rgba(80,96,128,.3);}

/* ===== 响应式 ===== */
@media(max-width:500px){
    #game-container{padding:12px 12px 6px}
    #scene-desc{font-size:14px;line-height:1.8}
    #interactions .btn{padding:6px 14px;font-size:12px}
    #header .title{font-size:15px;letter-spacing:4px}
    #sanity-fill{width:70px}
}
</style>
</head>
<body>

<div id="screen">
    <div class="scanline"></div>

    <div id="game-container">
        <!-- 顶部标题 + 理智值 -->
        <div id="header">
            <span class="title">唯 恐</span>
            <div id="sanity-bar">
                <span style="font-size:11px;color:#605040;">▎心神</span>
                <div id="sanity-fill"><span id="sanity-meter" style="width:100%"></span></div>
            </div>
        </div>

        <!-- 物品栏 -->
        <div id="inventory">
            <span class="label">▎物</span>
            <div class="slot" id="slot-0"></div>
            <div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div>
            <div class="slot" id="slot-3"></div>
        </div>

        <!-- 场景区 -->
        <div id="scene">
            <div id="scene-title">◈ 客厅</div>
            <div id="scene-desc"></div>
            <div id="interactions"></div>
        </div>

        <!-- 底部导航 -->
        <div id="nav"></div>
    </div>

    <!-- 遮罩弹窗 -->
    <div id="overlay">
        <div id="overlay-box">
            <h2 id="overlay-title"></h2>
            <div id="overlay-body"></div>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn" onclick="closeOverlay()">关 闭</button>
            </div>
        </div>
    </div>

    <!-- 结局画面 -->
    <div id="ending-screen">
        <h1 id="ending-title"></h1>
        <p id="ending-text"></p>
        <button class="btn" onclick="restartGame()">重 新 开 始</button>
    </div>
</div>

<script>
/* ============================================================
   唯 恐  — 微恐 ARG 网页游戏
   ============================================================ */
// ---- 音频引擎 (Web Audio 环境音) ----
let audioCtx = null;
let audioNodes = [];

function initAudio(){
    try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        // 低频环境嗡鸣
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 55;
        gain.gain.value = 0.3;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 200;
        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); audioNodes.push(osc);
        // 更高频微弱噪音
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sawtooth';
        osc2.frequency.value = 97;
        gain2.gain.value = 0.06;
        const filter2 = audioCtx.createBiquadFilter();
        filter2.type = 'lowpass'; filter2.frequency.value = 120;
        osc2.connect(filter2); filter2.connect(gain2); gain2.connect(audioCtx.destination);
        osc2.start(); audioNodes.push(osc2);
    }catch(e){/* 静默降级 */}
}

function playSting(){
    try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.6, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0;i<data.length;i++){
            const t=i/audioCtx.sampleRate;
            data[i]=Math.sin(2*Math.PI*220*t)*Math.max(0,1-t/0.6)*(0.3+Math.random()*0.2);
        }
        const src=audioCtx.createBufferSource(); src.buffer=buf;
        const g=audioCtx.createGain(); g.gain.value=0.3;
        src.connect(g); g.connect(audioCtx.destination); src.start();
    }catch(e){}
}

function playHeart(){
    try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0;i<data.length;i++){
            const t=i/audioCtx.sampleRate;
            data[i]=Math.sin(2*Math.PI*40*t)*Math.max(0,1-t/0.08)*0.5;
        }
        const src=audioCtx.createBufferSource(); src.buffer=buf;
        const g=audioCtx.createGain(); g.gain.value=0.4;
        src.connect(g); g.connect(audioCtx.destination); src.start();
    }catch(e){}
}

// ---- 游戏状态 ----
const G = {
    scene: 'livingroom',
    inventory: [],
    sanity: 100,
    flags: {
        noteRead:false, tvWatched:false, tvStaticCount:0,
        bookFound:false, hallwayMirror:false,
        bedroomEntered:false, laptopRead:false, wardrobeOpened:false,
        studyEntered:false, journalRead:false, photoExamined:false,
        bathroomEntered:false, bathroomMirror:false, cabinetOpened:false,
        clockFound:false, basementKey:false,
        basementEntered:false, finalChoice:false,
        endingType:''
    },
    _sceneHistory: [],
    _stingCooldown: 0
};

function getSanityColor(){
    if(G.sanity>60) return 'linear-gradient(90deg,#8a7a6a,#b0a090)';
    if(G.sanity>30) return 'linear-gradient(90deg,#a08050,#c09060)';
    return 'linear-gradient(90deg,#804040,#a05050)';
}

function updateUI(){
    const pct=Math.max(0,G.sanity);
    const m=document.getElementById('sanity-meter');
    m.style.width=pct+'%';
    m.style.background=getSanityColor();
    // 物品栏
    for(let i=0;i<4;i++){
        const el=document.getElementById('slot-'+(i+1));
        if(!el) continue;
        if(i<G.inventory.length){
            el.textContent=G.inventory[i].icon;
            el.className='slot has';
            el.title=G.inventory[i].name;
        } else {
            el.textContent='';
            el.className='slot';
            el.title='';
        }
    }
}

function sanityDown(n){
    G.sanity=Math.max(0,G.sanity-n);
    updateUI();
    if(n>=8 && G._stingCooldown<=0){
        playSting(); G._stingCooldown=5;
        // 屏幕微闪
        const s=document.getElementById('screen');
        s.style.animation='flicker .15s ease 3';
        setTimeout(()=>s.style.animation='',500);
    }
    if(G.sanity<=20){
        document.getElementById('scene-desc').style.opacity=0.6+Math.random()*0.4;
    }
}

// ---- 场景定义 ----
const SCENES = {};

// ===== 客厅 =====
SCENES.livingroom = {
    title:'◈ 客厅',
    desc:`这是你的公寓客厅。时钟指向深夜，昏黄的壁灯在墙上投下摇晃的影子。
电视机开着，屏幕上只有<em>沙沙</em>的雪花。茶几上散落着几页纸，旁边的书架塞满了旧书。
空气中有一股淡淡的……霉味？你不记得以前有过。

你莫名感到<em>不安</em>，但说不清为什么。`,
    nav:[{id:'hallway',label:'走廊'},{id:'study',label:'书房'}],
    items:[
        {id:'note',label:'📄 查看茶几上的纸',hint:'一张对折的纸'},
        {id:'tv',label:'📺 看电视机',hint:'雪花沙沙响'},
        {id:'bookshelf',label:'📚 查看书架',hint:'旧书塞得满满'}
    ],
    actions:{
        note(){
            G.flags.noteRead=true;
            showOverlay('一张纸条','<p>纸上只有一行字，用潦草的笔迹写着——</p><p style="font-size:20px;text-align:center;letter-spacing:6px;color:#a08070;margin:18px 0;">「别 回 头」</p><p style="color:#706050;font-size:12px;">你不确定这是不是你自己的字迹。</p>');
            if(!G.flags.clockFound){G.flags.clockFound=true; sanityDown(5);}
        },
        tv(){
            G.flags.tvWatched=true;
            G.flags.tvStaticCount=(G.flags.tvStaticCount||0)+1;
            let extra='';
            if(G.flags.tvStaticCount===1){
                extra='<p>雪花纹丝不动。但你盯着看了很久——你几乎觉得那噪点中有什么形状在<em>蠕动</em>。</p>';
                sanityDown(4);
            } else if(G.flags.tvStaticCount===2){
                extra='<p>这一次……雪花短暂地消散了一下。画面里出现了一个房间——和你现在站着的这个一模一样——但里面<em>有人</em>。那人背对着你，慢慢转过头来——</p><p>然后画面切回雪花。</p>';
                sanityDown(8);
            } else {
                extra='<p>电视似乎正常了。只是普通的雪花。但你能感觉到……有什么东西从屏幕里<em>看着你</em>。</p>';
            }
            showOverlay('电视机',`<p>雪花沙沙作响，在安静的房间里格外刺耳。</p>${extra}`);
        },
        bookshelf(){
            if(!G.flags.bookFound){
                G.flags.bookFound=true;
                G.inventory.push({icon:'🔑',name:'旧钥匙'});
                updateUI();
                showOverlay('书架上','<p>你抽出一本名为《唯恐》的旧书，书页间掉出一把<em>生锈的钥匙</em>。</p><p>钥匙上刻着一个数字：<strong>7</strong>。</p><p>你把钥匙收了起来。</p>');
                playSting();
            } else {
                showOverlay('书架','<p>书架上大多是些旧小说和工具书。那本《唯恐》你放回去了，但总觉得它<em>在盯着你</em>。</p>');
            }
        }
    }
};

// ===== 走廊 =====
SCENES.hallway = {
    title:'◈ 走廊',
    desc:`走廊比记忆中长了一些。昏黄的灯泡有一盏在闪烁，墙壁上的影子跟着一跳一跳的。
走廊尽头有一面<em>穿衣镜</em>，反射着走廊深处的黑暗。
左边是卧室门，右边是浴室门。尽头似乎还有一扇向下的门——地下室？你不记得有地下室。`,
    nav:[{id:'livingroom',label:'客厅'},{id:'bedroom',label:'卧室'},{id:'bathroom',label:'浴室'},{id:'basement',label:'下楼梯',need:'basementKey'}],
    items:[
        {id:'mirror',label:'🪞 看那面镜子',hint:'走廊尽头的穿衣镜'}
    ],
    actions:{
        mirror(){
            G.flags.hallwayMirror=true;
            sanityDown(6);
            showOverlay('镜子','<p>你看向镜中的自己。</p><p>你站在走廊里。镜中的你也站在走廊里。</p><p>但镜中的你，<em>没有在呼吸</em>。</p><p>你屏住气，看着镜中的自己——它一动不动，像一尊蜡像。然后，它的嘴角<em>慢慢地</em>弯了一下。</p><p>你退后了一步。镜中的你没有动。</p>');
            playSting();
        }
    }
};

// ===== 卧室 =====
SCENES.bedroom = {
    title:'◈ 卧室',
    desc:`卧室很暗。窗帘拉得严严实实，月光勉强透进来一丝。
床上被褥凌乱，像是有人刚起来——但你是一个人住。
笔记本电脑合着放在书桌上，旁边有一个<em>老式闹钟</em>，指针停在<strong>3:07</strong>。
衣柜的门<em>虚掩着</em>，露出一条黑缝。`,
    nav:[{id:'hallway',label:'走廊'}],
    items:[
        {id:'laptop',label:'💻 打开笔记本',hint:'合着的笔记本电脑'},
        {id:'wardrobe',label:'🚪 打开衣柜',hint:'虚掩着的衣柜'},
        {id:'window',label:'🪟 看看窗外',hint:'拉紧的窗帘'}
    ],
    actions:{
        laptop(){
            if(!G.flags.laptopRead){
                G.flags.laptopRead=true;
                G.flags.clockFound=true;
                sanityDown(5);
                showOverlay('笔记本电脑',
                    `<p>屏幕亮起。桌面上有一个打开的文本文件，标题是——</p>
                    <p style="text-align:center;letter-spacing:4px;margin:14px 0;color:#a08070;">「给 自 己 的 备 忘」</p>
                    <p>「钥匙在客厅书架的书里。地下室。我藏了一些东西在那里。如果我不记得了——去看看。」</p>
                    <p style="color:#706050;font-size:12px;">文件的修改时间是……2036年。这不可能是真的。</p>`);
                if(!G.flags.basementKey && G.flags.bookFound){
                    G.flags.basementKey=true;
                    setTimeout(()=>{
                        showOverlay('提示','<p>你摸到口袋里那把旧钥匙——它<em>微微发烫</em>。</p><p>也许它就是用来开那扇地下室门的。</p>');
                    },500);
                }
            } else {
                showOverlay('笔记本电脑','<p>文件还在那里。你注意到最下面还有一行小字：</p><p style="text-align:center;color:#605040;font-size:12px;">「记住，你不是第一次看到这个。」</p>');
            }
        },
        wardrobe(){

// ---- 场景渲染 ----
let currentInteractions = null;

function renderScene(sceneId){
    const scene=SCENES[sceneId];
    if(!scene) return;
    G.scene=sceneId;
    G._stingCooldown=Math.max(0,G._stingCooldown-1);

    document.getElementById('scene-title').textContent=scene.title;
    document.getElementById('scene-desc').innerHTML=scene.desc;

    // 导航
    const navEl=document.getElementById('nav');
    navEl.innerHTML='';
    scene.nav.forEach(n=>{
        const btn=document.createElement('button');
        btn.className='btn';
        btn.textContent=n.label;
        if(n.need && !G.flags[n.need]){
            btn.className+=' disabled';
            btn.title='你还不知道通往这里的钥匙在哪里……';
        } else {
            btn.onclick=()=>{
                if(n.need && !G.flags[n.need]) return;
                // 理智消耗
                const costs={bedroom:1,study:1,bathroom:2,basement:3};
                if(costs[n.id]) sanityDown(costs[n.id]);
                renderScene(n.id);
            };
        }
        navEl.appendChild(btn);
    });

    // 互动项
    const intEl=document.getElementById('interactions');
    intEl.innerHTML='';
    scene.items.forEach(item=>{
        const btn=document.createElement('button');
        btn.className='btn';
        btn.innerHTML=item.label+(item.hint?'<span class="hint">'+item.hint+'</span>':'');
        btn.onclick=()=>{
            const action=scene.actions[item.id];
            if(action) action();
        };
        intEl.appendChild(btn);
    });
    currentInteractions=intEl;

    // 理智过低时场景抖动
    if(G.sanity<=25){
        const desc=document.getElementById('scene-desc');
        if(Math.random()<0.08){
            desc.style.transform='translate('+(Math.random()*4-2)+'px,'+(Math.random()*4-2)+'px)';
            setTimeout(()=>desc.style.transform='',200);
            if(Math.random()<0.3) sanityDown(1);
        }
    }

    updateUI();
    // 检查是否触发结局条件
    checkEnding();
}

// ---- 结局系统 ----
function checkEnding(){
    if(G.flags.endingType) return;
    // 如果理智归零
    if(G.sanity<=0 && !G.flags.endingType){
        G.flags.endingType='madness';
        showEnding('madness');
    }
}

function endingChoice(know){
    closeOverlay();
    if(know){
        G.flags.endingType='truth';
        showEnding('truth');
    } else {
        G.flags.endingType='denial';
        showEnding('denial');
    }
}

function restartGame(){
    location.reload();
}

// ---- 弹窗 ----
function showOverlay(title,body){
    const el=document.getElementById('overlay');
    document.getElementById('overlay-title').textContent=title;
    document.getElementById('overlay-body').innerHTML=body;
    el.classList.add('show');
}

function closeOverlay(){
    document.getElementById('overlay').classList.remove('show');
}

// ---- 全局点击初始化音频 ----
document.addEventListener('click',()=>{
    if(!audioCtx) initAudio();
},{once:true});

// ---- 启动 ----
renderScene('livingroom');
updateUI();

// 每秒轻微理智波动（低理智时）
setInterval(()=>{
    if(G.flags.endingType) return;
    if(G.sanity<50 && G.sanity>0 && Math.random()<0.1){
        sanityDown(1);
    }
    G._stingCooldown=Math.max(0,G._stingCooldown-1);
},3000);
