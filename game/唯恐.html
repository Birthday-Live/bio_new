<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唯 恐</title>
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0808}
body{
    font-family:'Georgia','STSong','Noto Serif SC','SimSun',serif;
    color:#b8a898;user-select:none;-webkit-tap-highlight-color:transparent;
}

/* ===== CRT 外壳 (移动端全屏，桌面仿CRT) ===== */
#crt{
    position:relative;width:100vw;height:100vh;margin:auto;overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#141010 0%,#0a0808 70%,#000 100%);
}
/* 扫描线（所有设备） */
#crt::before{
    content:'';position:absolute;inset:0;z-index:999;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.10) 2px,rgba(0,0,0,.10) 4px);
}
/* 暗角 */
#crt::after{
    content:'';position:absolute;inset:0;z-index:999;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%);
}

/* ===== 全局布局 ===== */
#game{
    position:absolute;inset:0;z-index:10;
    padding:14px 16px 10px;
    display:flex;flex-direction:column;height:100%;
}

/* ===== 顶栏 ===== */
#topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 2px 10px 2px;border-bottom:1px solid rgba(180,160,140,.08);
    flex-shrink:0;gap:10px;flex-wrap:wrap;
}
#topbar .logo{
    font-size:18px;letter-spacing:6px;color:#c0b0a0;flex-shrink:0;
    text-shadow:0 0 30px rgba(180,160,140,.12);
}
#topbar .logo small{display:none;}

#top-meta{display:flex;align-items:center;gap:12px;flex-shrink:0;}

/* 心神条 */
#sanity-wrap{display:flex;align-items:center;gap:6px;}
#sanity-wrap .label{font-size:10px;color:#605040;letter-spacing:1px;}
#sanity-track{
    width:80px;height:4px;background:rgba(180,160,140,.08);border-radius:3px;overflow:hidden;
}
#sanity-track span{
    display:block;height:100%;border-radius:3px;transition:width .7s ease,background .7s ease;
    width:100%;background:linear-gradient(90deg,#9a8a7a,#c0b0a0);
}
#sanity-num{font-size:10px;color:#706050;letter-spacing:1px;min-width:24px;text-align:right;}

/* 物品栏 */
#inv-wrap{display:flex;align-items:center;gap:4px;}
#inv-wrap .label{font-size:10px;color:#605040;letter-spacing:1px;}
.inv-slot{
    width:26px;height:26px;border:1px solid rgba(180,160,140,.12);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:14px;
    background:rgba(0,0,0,.35);transition:all .3s;
}
.inv-slot.has{border-color:rgba(180,160,140,.35);background:rgba(180,160,140,.04);}

/* ===== 房间导航标签页（可横向滑动） ===== */
#room-tabs{
    display:flex;gap:0;padding:8px 0 0;flex-shrink:0;
    border-bottom:1px solid rgba(180,160,140,.06);margin-bottom:10px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    flex-wrap:nowrap;
}
#room-tabs::-webkit-scrollbar{display:none}
.tab{
    padding:7px 12px 9px;font-size:12px;font-family:inherit;letter-spacing:1px;
    background:transparent;border:none;border-bottom:2px solid transparent;
    color:#605040;cursor:pointer;transition:all .25s ease;white-space:nowrap;
    position:relative;flex-shrink:0;min-height:44px;display:flex;align-items:center;
}
.tab:active{background:rgba(180,160,140,.08);}
.tab.active{color:#d0c0b0;border-bottom-color:#b0a090;}
.tab.locked{color:#403530;cursor:not-allowed;opacity:.5;}
.tab.locked::after{
    content:'🔒';font-size:8px;position:absolute;top:2px;right:1px;opacity:.5;
}
.tab .dot{
    display:inline-block;width:4px;height:4px;border-radius:50%;
    background:#605040;margin-right:5px;flex-shrink:0;
}
.tab.active .dot{background:#d0c0b0;box-shadow:0 0 6px rgba(180,160,140,.3);}
.tab.locked .dot{background:#403530;}

/* ===== 主体区 ===== */
#main{
    flex:1;display:flex;gap:0;min-height:0;overflow:hidden;
}

/* 场景 */
#scene{
    flex:1;display:flex;flex-direction:column;overflow-y:auto;
    padding:0 2px 0 0;min-width:0;
}
#scene::-webkit-scrollbar{width:3px;}
#scene::-webkit-scrollbar-thumb{background:rgba(180,160,140,.08);border-radius:2px;}
#scene::-webkit-scrollbar-track{background:transparent;}

#scene-title{
    font-size:12px;color:#706050;letter-spacing:4px;margin-bottom:12px;
    border-left:2px solid rgba(180,160,140,.18);padding-left:12px;flex-shrink:0;
}

#scene-desc{
    font-size:14px;line-height:1.9;color:#c8bbb0;margin-bottom:14px;
    text-shadow:0 0 20px rgba(180,160,140,.02);flex-shrink:0;
}
#scene-desc em{color:#b09080;font-style:italic;}
#scene-desc strong{color:#c0a090;font-weight:normal;}

/* 互动按钮区 — 移动端大按钮方便戳 */
#actions{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding:12px 0 4px;
}
#actions .btn-act{
    padding:10px 16px;font-size:13px;font-family:inherit;letter-spacing:1px;
    background:rgba(180,160,140,.06);border:1px solid rgba(180,160,140,.15);
    border-radius:8px;color:#b8a898;cursor:pointer;transition:all .2s ease;
    text-align:left;line-height:1.3;min-height:44px;flex:1 0 auto;min-width:120px;
    -webkit-touch-callout:none;
}
#actions .btn-act:active{
    background:rgba(180,160,140,.14);border-color:rgba(180,160,140,.35);
    transform:scale(.98);
}
#actions .btn-act .hint{
    display:block;font-size:10px;color:#605040;letter-spacing:0;margin-top:1px;
}

/* 右侧氛围面板（仅桌面） */
#ambient{display:none;}

/* ===== 遮罩弹窗 ===== */
#overlay{
    position:absolute;inset:0;z-index:500;
    display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.88);backdrop-filter:blur(6px);
}
#overlay.show{display:flex}
#overlay-box{
    width:92%;max-width:500px;padding:24px 22px;
    border:1px solid rgba(180,160,140,.12);
    background:rgba(12,10,10,.97);border-radius:10px;max-height:80vh;overflow-y:auto;
    margin:10px;
}
#overlay-box h2{
    font-size:14px;color:#b0a090;letter-spacing:4px;margin-bottom:14px;
    font-weight:normal;border-left:2px solid rgba(180,160,140,.18);padding-left:12px;
}
#overlay-box p{font-size:13px;line-height:1.9;color:#b8a898;margin-bottom:10px;}
#overlay-box hr{border:none;border-top:1px solid rgba(180,160,140,.06);margin:10px 0;}
#overlay-box .btn-close{
    padding:8px 20px;font-size:12px;font-family:inherit;letter-spacing:2px;
    background:rgba(180,160,140,.08);border:1px solid rgba(180,160,140,.18);border-radius:6px;
    color:#b0a090;cursor:pointer;transition:all .2s;min-height:40px;
}
#overlay-box .btn-close:active{background:rgba(180,160,140,.18);}
#overlay-box .btn-choice{
    padding:10px 22px;font-size:13px;font-family:inherit;letter-spacing:2px;
    background:rgba(180,160,140,.08);border:1px solid rgba(180,160,140,.22);border-radius:6px;
    color:#b8a898;cursor:pointer;transition:all .2s;margin:0 4px 6px;min-height:44px;
}
#overlay-box .btn-choice:active{background:rgba(180,160,140,.2);border-color:rgba(180,160,140,.35);}
#overlay-box .btn-choice.danger{color:#b08070;border-color:rgba(180,100,80,.2);}
#overlay-box .btn-choice.danger:active{background:rgba(180,100,80,.12);}

/* ===== 结局 ===== */
#ending{
    position:absolute;inset:0;z-index:800;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 20px;
    background:radial-gradient(ellipse at center,#0e0a0a 0%,#000 100%);
}
#ending.show{display:flex}
#ending h1{font-size:26px;letter-spacing:10px;margin-bottom:12px;font-weight:normal;}
#ending .sub{font-size:12px;color:#605040;letter-spacing:3px;margin-bottom:18px;}
#ending p{font-size:13px;line-height:2;color:#b0a090;max-width:440px;margin-bottom:16px;}
#ending .btn-restart{
    padding:10px 28px;font-size:13px;font-family:inherit;letter-spacing:3px;
    background:rgba(180,160,140,.08);border:1px solid rgba(180,160,140,.18);border-radius:6px;
    color:#b0a090;cursor:pointer;transition:all .2s;min-height:44px;margin-top:4px;
}
#ending .btn-restart:active{background:rgba(180,160,140,.18);}
.ending-truth h1{color:#a06050;text-shadow:0 0 40px rgba(160,96,80,.15);}
.ending-truth .sub{color:#604040;}
.ending-deny h1{color:#506070;text-shadow:0 0 40px rgba(80,96,112,.15);}
.ending-deny .sub{color:#304050;}
.ending-mad h1{color:#604040;text-shadow:0 0 40px rgba(96,64,64,.15);}
.ending-mad .sub{color:#403030;}

/* ===== 动画 ===== */
@keyframes flicker{
    0%,100%{opacity:1}92%{opacity:1}93%{opacity:.3}94%{opacity:.7}96%{opacity:.15}97%{opacity:.9}
}
@keyframes glitchText{
    0%{transform:translate(0)}20%{transform:translate(-2px,1px);color:#a08070}
    40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,0);color:#c09080}
    80%{transform:translate(1px,1px)}100%{transform:translate(0)}
}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.65}}

/* ===== 桌面样式 (≥768px) ===== */
@media(min-width:768px){
    #crt{
        max-width:1000px;max-height:780px;
        box-shadow:0 0 120px rgba(0,0,0,.95),inset 0 0 200px rgba(0,0,0,.7);
        border-radius:14px;
    }
    #crt::before,#crt::after{border-radius:14px}
    #game{padding:18px 26px 14px;}

    #topbar{padding:0 4px 14px 4px;gap:16px;flex-wrap:nowrap;}
    #topbar .logo{font-size:22px;letter-spacing:10px;}
    #topbar .logo small{display:inline;font-size:11px;letter-spacing:2px;color:#605040;margin-left:8px;}
    #top-meta{gap:18px;}
    #sanity-wrap .label{font-size:11px;letter-spacing:2px;}
    #sanity-track{width:110px;}
    #sanity-num{font-size:11px;min-width:28px;}
    #inv-wrap .label{font-size:11px;letter-spacing:2px;}
    .inv-slot{width:30px;height:30px;font-size:16px;}

    #room-tabs{gap:2px;padding:10px 0 0;margin-bottom:14px;}
    .tab{padding:8px 18px 10px;font-size:13px;letter-spacing:3px;min-height:auto;}
    .tab:hover{color:#a09080;border-bottom-color:rgba(180,160,140,.15);}
    .tab.locked::after{font-size:9px;top:4px;right:2px;}
    .tab .dot{width:5px;height:5px;margin-right:6px;}

    #main{gap:20px;}
    #scene{padding-right:6px;}
    #scene-title{font-size:13px;letter-spacing:5px;margin-bottom:16px;padding-left:14px;}
    #scene-desc{font-size:15px;line-height:2;margin-bottom:18px;}

    #actions{gap:8px;padding:16px 0 4px;}
    #actions .btn-act{padding:9px 20px;font-size:13px;min-height:auto;flex:none;min-width:auto;}
    #actions .btn-act:hover{
        background:rgba(180,160,140,.12);border-color:rgba(180,160,140,.35);
        color:#d8c8b8;transform:translateY(-1px);box-shadow:0 2px 12px rgba(0,0,0,.3);
    }
    #actions .btn-act:active{transform:translateY(0);}
    #actions .btn-act .hint{font-size:10px;margin-top:2px;}

    /* 右侧氛围面板 */
    #ambient{
        display:flex;flex-direction:column;gap:12px;
        flex:0 0 180px;border-left:1px solid rgba(180,160,140,.06);padding-left:18px;
        justify-content:center;
    }
    #room-visual{
        flex:1;border-radius:8px;background:rgba(0,0,0,.3);min-height:120px;
        display:flex;align-items:center;justify-content:center;
        border:1px solid rgba(180,160,140,.06);overflow:hidden;
    }
    #room-visual .ascii-art{
        font-size:11px;line-height:1.3;color:#504540;text-align:center;
        white-space:pre;font-family:'Courier New',monospace;letter-spacing:1px;
        filter:blur(.4px);opacity:.65;
    }
    #hint-box{
        font-size:11px;color:#504540;line-height:1.6;padding:10px 12px;
        border:1px solid rgba(180,160,140,.06);border-radius:6px;
        background:rgba(0,0,0,.2);min-height:50px;letter-spacing:.5px;
    }

    #overlay-box{padding:30px 34px;}
    #overlay-box h2{font-size:15px;letter-spacing:6px;padding-left:14px;}
    #overlay-box p{font-size:14px;}
    #overlay-box .btn-close{min-height:auto;}
    #overlay-box .btn-choice{min-height:auto;}
    #overlay-box .btn-choice:hover{background:rgba(180,160,140,.18);border-color:rgba(180,160,140,.4);}
    #overlay-box .btn-choice.danger:hover{background:rgba(180,100,80,.1);border-color:rgba(180,100,80,.3);}

    #ending{padding:40px;}
    #ending h1{font-size:32px;letter-spacing:14px;}
    #ending .sub{font-size:13px;letter-spacing:4px;}
    #ending p{font-size:14px;max-width:480px;}
    #ending .btn-restart{min-height:auto;}
    #ending .btn-restart:hover{background:rgba(180,160,140,.16);}
}

/* ===== 小屏微调 ===== */
@media(max-width:400px){
    #game{padding:10px 10px 6px;}
    #topbar .logo{font-size:16px;letter-spacing:4px;}
    #sanity-track{width:60px;}
    .inv-slot{width:22px;height:22px;font-size:12px;}
    .tab{padding:6px 8px 8px;font-size:11px;letter-spacing:0;}
    #scene-desc{font-size:13px;}
    #actions .btn-act{padding:8px 12px;font-size:12px;min-width:80px;min-height:40px;}
    #overlay-box{padding:16px;}
    #ending h1{font-size:20px;letter-spacing:6px;}
}
</style>
</head>
<body>

<div id="crt">
<div id="game">

    <!-- ===== 顶栏 ===== -->
    <div id="topbar">
        <div class="logo">唯 恐 <small>— 微恐 · 叙事 —</small></div>
        <div id="top-meta">
            <div id="sanity-wrap">
                <span class="label">▎心神</span>
                <div id="sanity-track"><span id="sanity-bar"></span></div>
                <span id="sanity-num">100</span>
            </div>
            <div id="inv-wrap">
                <span class="label">▎物</span>
                <div class="inv-slot" id="slot-0"></div>
                <div class="inv-slot" id="slot-1"></div>
                <div class="inv-slot" id="slot-2"></div>
                <div class="inv-slot" id="slot-3"></div>
            </div>
        </div>
    </div>

    <!-- ===== 房间标签栏 ===== -->
    <div id="room-tabs"></div>

    <!-- ===== 主体 ===== -->
    <div id="main">
        <div id="scene">
            <div id="scene-title">◈</div>
            <div id="scene-desc"></div>
            <div id="actions"></div>
        </div>
        <div id="ambient">
            <div id="room-visual"><div class="ascii-art" id="ascii-art"></div></div>
            <div id="hint-box">⋮ 探索房间中的物品<br>⋮ 留意每处细节</div>
        </div>
    </div>

</div>

<!-- ===== 弹窗 ===== -->
<div id="overlay">
    <div id="overlay-box">
        <h2 id="overlay-title"></h2>
        <div id="overlay-body"></div>
        <div style="text-align:right;margin-top:14px;">
            <button class="btn-close" onclick="closeOverlay()">关 闭</button>
        </div>
    </div>
</div>

<!-- ===== 结局 ===== -->
<div id="ending">
    <h1 id="ending-title"></h1>
    <div class="sub" id="ending-sub"></div>
    <div id="ending-text"></div>
    <button class="btn-restart" onclick="location.reload()">重 新 开 始</button>
</div>
</div>

<script>
/* ============================================================
   唯 恐  —  微恐 ARG 桌面叙事游戏
   ============================================================ */

// ─── 音频引擎 ──────────────────────────────────────────
let AC = null;
function initAudio(){
    try{
        if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
        const osc = AC.createOscillator(), g = AC.createGain();
        osc.type='sine'; osc.frequency.value=52;
        g.gain.value=0.25;
        const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
        osc.connect(f); f.connect(g); g.connect(AC.destination); osc.start();
        const osc2 = AC.createOscillator(), g2 = AC.createGain();
        osc2.type='sawtooth'; osc2.frequency.value=95; g2.gain.value=0.04;
        const f2=AC.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=110;
        osc2.connect(f2); f2.connect(g2); g2.connect(AC.destination); osc2.start();
    }catch(e){}
}
function playSting(){
    try{
        if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
        const buf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++){
            const t=i/AC.sampleRate;
            d[i]=Math.sin(2*Math.PI*190*t)*Math.max(0,1-t/.5)*(.25+Math.random()*.15);
        }
        const s=AC.createBufferSource(); s.buffer=buf;
        const g=AC.createGain(); g.gain.value=.25;
        s.connect(g); g.connect(AC.destination); s.start();
    }catch(e){}
}
function playHeart(){
    try{
        if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
        const buf=AC.createBuffer(1,AC.sampleRate*.07,AC.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++){
            const t=i/AC.sampleRate;
            d[i]=Math.sin(2*Math.PI*38*t)*Math.max(0,1-t/.07)*.4;
        }
        const s=AC.createBufferSource(); s.buffer=buf;
        const g=AC.createGain(); g.gain.value=.35;
        s.connect(g); g.connect(AC.destination); s.start();
    }catch(e){}
}

// ─── 房间数据 ──────────────────────────────────────────
const ROOMS = [{
    id:'livingroom', label:'客厅', icon:'◈',
    locked:false,
    desc:`这是你的公寓客厅。时钟指向深夜，昏黄的壁灯在墙上投下摇晃的影子。

电视机开着，屏幕上只有<em>沙沙</em>的雪花。茶几上散落着几页纸，旁边的书架塞满了旧书。

空气中有一股淡淡的……霉味？你不记得以前有过。

你莫名感到<em>不安</em>，但说不清为什么。`,
    ascii:[
        '┌──────────────┐',
        '│  ██  📺  ██  │',
        '│  ██ 沙沙 ██  │',
        '│  ────────  │',
        '│ 📄      📚 │',
        '│            │',
        '│  ████████  │',
        '└──────────────┘'
    ],
    items:[
        {id:'note', label:'📄 茶几上的纸', hint:'一张对折的纸条'},
        {id:'tv', label:'📺 电视机', hint:'雪花沙沙作响'},
        {id:'bookshelf', label:'📚 书架', hint:'塞满旧书的书架'}
    ]
},{
    id:'hallway', label:'走廊', icon:'◈',
    locked:false,
    desc:`走廊比记忆中长了一些。昏黄的灯泡有一盏在闪烁，墙壁上的影子跟着一跳一跳的。

走廊尽头有一面<em>穿衣镜</em>，反射着走廊深处的黑暗。

左边是卧室门，右边是浴室门。尽头似乎还有一扇向下的门——地下室？你不记得有地下室。`,
    ascii:[
        '┌──────────────┐',
        '│   💡  💡     │',
        '│  ┌──┐ ┌──┐  │',
        '│  │卧│ │浴│  │',
        '│  └──┘ └──┘  │',
        '│       🪞    │',
        '│  ╔══════╗   │',
        '│  ║地下 ║   │',
        '└──────────────┘'
    ],
    items:[
        {id:'mirror', label:'🪞 走廊尽头的镜子', hint:'一面老旧的穿衣镜'}
    ]
},{
    id:'bedroom', label:'卧室', icon:'◈',
    locked:false,
    desc:`卧室很暗。窗帘拉得严严实实，月光勉强透进来一丝。

床上被褥凌乱，像是有人刚起来——但你是一个人住。

笔记本电脑合着放在书桌上，旁边有一个<em>老式闹钟</em>，指针停在 <strong>3:07</strong>。

衣柜的门<em>虚掩着</em>，露出一条黑缝。`,
    ascii:[
        '┌──────────────┐',
        '│ 🛏️  ░░░░    │',
        '│ 凌乱   ░░   │',

// ─── DOM 引用 ──────────────────────────────────────────
const $ = id=>document.getElementById(id);
const sceneTitle=$('scene-title'), sceneDesc=$('scene-desc');
const actionsEl=$('actions'), tabsEl=$('room-tabs');
const sanityBar=$('sanity-bar'), sanityNum=$('sanity-num');
const asciiEl=$('ascii-art'), hintBox=$('hint-box');

// ─── UI 更新 ──────────────────────────────────────────
function updateUI(){
    const p=Math.max(0,G.sanity);
    sanityBar.style.width=p+'%';
    if(p>60) sanityBar.style.background='linear-gradient(90deg,#9a8a7a,#c0b0a0)';
    else if(p>30) sanityBar.style.background='linear-gradient(90deg,#b09050,#c8a060)';
    else sanityBar.style.background='linear-gradient(90deg,#905040,#b05050)';
    sanityNum.textContent=Math.round(p);
    // 物品栏
    for(let i=0;i<4;i++){
        const el=$('slot-'+i);
        if(!el) continue;
        if(i<G.inventory.length){
            el.textContent=G.inventory[i].icon;
            el.className='inv-slot has';
            el.title=G.inventory[i].name;
        } else { el.textContent=''; el.className='inv-slot'; el.title=''; }
    }
}

function sanityDown(n){
    G.sanity=Math.max(0,G.sanity-n);
    updateUI();
    if(n>=8 && G._cd<=0){ playSting(); G._cd=5;
        $('crt').style.animation='flicker .15s ease 3';
        setTimeout(()=>$('crt').style.animation='',500);
    }
    if(G.sanity<=20 && Math.random()<.15){
        sceneDesc.style.transform='translate('+(Math.random()*3-1.5)+'px)';
        setTimeout(()=>sceneDesc.style.transform='',150);
    }
}

// ─── 弹窗 ──────────────────────────────────────────────
function showOverlay(title,body){
    $('overlay-title').textContent=title;
    $('overlay-body').innerHTML=body;
    $('overlay').classList.add('show');
}
function closeOverlay(){ $('overlay').classList.remove('show'); }

// ─── 场景渲染 ──────────────────────────────────────────
function renderScene(id){
    const room = ROOMS.find(r=>r.id===id);
    if(!room) return;
    G.scene=id; G._cd=Math.max(0,G._cd-1);

    const locked = room.locked && !G.flags[room.lockKey];
    sceneTitle.textContent='◈ '+room.label;
    sceneDesc.innerHTML=locked
        ? '<p style="color:#504540;letter-spacing:2px;">🔒 门锁着。你需要找到钥匙。</p>'
        : room.desc;

    // ASCII art
    asciiEl.textContent=room.ascii.join('\n');
    asciiEl.style.animation='breathe 4s ease-in-out infinite';

    // 互动
    actionsEl.innerHTML='';
    if(!locked){
        room.items.forEach(item=>{
            const btn=document.createElement('button');
            btn.className='btn-act';
            btn.innerHTML=item.label+(item.hint?'<span class="hint">'+item.hint+'</span>':'');
            btn.onclick=()=>{
                const acts = ACTIONS[room.id];
                if(acts && acts[item.id]) acts[item.id]();
                else showOverlay(item.label,'<p>你仔细看了看，但没发现什么特别的东西。</p>');
            };
            actionsEl.appendChild(btn);
        });
    }

    // 提示
    const hints = {
        livingroom:'客厅里似乎藏着什么……',
        hallway:'走廊尽头的镜子让人不安。',
        bedroom:'卧室里也许有线索。',
        study:'日记里可能写着什么。',
        bathroom:'浴室里的镜子……别盯着太久。',
        basement: canGoodEnding() ? '你已集齐线索。砸碎它，迎来破晓。' : '心神未定，尚有迷雾未散……'
    };
    hintBox.textContent=locked?'🔒 门锁着':'⋮ '+(hints[id]||'继续探索……');

    // Tabs
    renderTabs();
    updateUI();
    checkEnding();

    // 低理智额外效果
    if(G.sanity<=25 && Math.random()<.05){
        sceneDesc.style.animation='glitchText .15s ease 2';
        setTimeout(()=>sceneDesc.style.animation='',400);
        sanityDown(1);
    }
}

function renderTabs(){
    tabsEl.innerHTML='';
    ROOMS.forEach(r=>{
        const btn=document.createElement('button');
        const locked = r.locked && !G.flags[r.lockKey];
        btn.className='tab'+(r.id===G.scene?' active':'')+(locked?' locked':'');
        btn.innerHTML='<span class="dot"></span>'+r.label;
        if(locked) btn.title='🔒 需要钥匙';
        else btn.onclick=()=>{
            if(r.id===G.scene) return;
            const costs={bedroom:1,study:1,bathroom:2,basement:3};
            if(costs[r.id]) sanityDown(costs[r.id]);
            renderScene(r.id);
        };
        tabsEl.appendChild(btn);
    });
}

                <p>但它<em>没有在动</em>。它静静地注视着镜外的你，眼神里带着一种……<em>悲伤的怜悯</em>。</p>
                <p>然后它开口了。没有声音，但你知道它在说什么：</p>
                <p style="text-align:center;font-size:16px;color:#806060;letter-spacing:4px;margin:14px 0;">「你终于来了。」</p>
                <p style="text-align:center;font-size:16px;color:#806060;letter-spacing:4px;margin:14px 0;">「现在——你想知道真相吗？」</p>
                <div style="text-align:center;margin-top:20px;">
                    <button class="btn-choice" onclick="endingChoose(true)">知道真相</button>
                    <button class="btn-choice danger" onclick="endingChoose(false)">放下镜子</button>
                    ${canGoodEnding() ? '<button class="btn-choice" style="color:#708060;border-color:rgba(100,140,80,.3);" onclick="endingChoose(\'good\')">🌅 砸碎镜子</button>' : ''}
                </div>
                ${!canGoodEnding() ? '<p style="color:#504540;font-size:11px;margin-top:10px;text-align:center;">⋮ 你心中尚有疑虑，无法下定决心砸碎它……</p>' : ''}`);
        }
    },
    smash(){
        if(canGoodEnding()){
            showOverlay('举起石头',
                `<p>你拾起角落里那块松动的砖石。它沉甸甸的，棱角分明。</p>
                <p>你看向圆圈中央的那面手镜。</p>
                <p>你知道该怎么做了。</p>
                <p style="text-align:center;margin:16px 0;">
                    <button class="btn-choice" onclick="endingChoose('good')" style="color:#708060;border-color:rgba(100,140,80,.3);">🔨 砸碎镜子</button>
                </p>
                <p style="color:#706050;font-size:12px;">一旦砸碎，就无法回头了。</p>`);
        } else {
            let hint = '<p>你捡起那块石头，举到一半——却停下了。</p><p>你心中还有太多疑团未解。就这样砸下去，你不敢保证会发生什么。</p>';
            if(!G.flags.journalRead) hint += '<p style="color:#605040;font-size:12px;">⋮ 书房的日记……你应该再读一遍。</p>';
            if(!G.flags.bathMirror) hint += '<p style="color:#605040;font-size:12px;">⋮ 浴室的镜子上似乎有什么线索。</p>';
            if(!G.flags.laptopRead) hint += '<p style="color:#605040;font-size:12px;">⋮ 卧室的笔记本电脑里也许有答案。</p>';
            if(G.sanity<=40) hint += '<p style="color:#605040;font-size:12px;">⋮ 你的心神太乱了，无法冷静地做出决定。</p>';
            hint += '<p style="color:#504540;font-size:12px;margin-top:8px;">先集齐所有线索，保持心神清明，再回来吧。</p>';
            showOverlay('你放下了石头', hint);
        }
    },
    symbols(){
        showOverlay('墙上的符号',
            `<p>墙上刻满了重复的螺旋图案，密密麻麻，像某种强迫性的涂鸦。</p>
            <p>但有一个角落，刻着你能看懂的文字——不是中文，而是你的记忆深处某个熟悉的语言。你本能地能"读"出它的意思：</p>
            <p style="text-align:center;font-size:15px;color:#806060;margin:12px 0;">「世界是一面镜子。你看到的都是你自己。」</p>
            <p style="text-align:center;font-size:15px;color:#806060;margin:12px 0;">「恐惧也是一面镜子。你害怕的——」</p>
            <p style="text-align:center;font-size:15px;color:#806060;margin:12px 0;">「是你自己。」</p>`);
    }
};

// ─── 好结局条件 ───────────────────────────────────────
function canGoodEnding(){
    const f=G.flags;
    return f.journalRead && f.bathMirror && f.laptopRead && G.sanity>40;
}

// ─── 结局系统 ──────────────────────────────────────────
function checkEnding(){
    if(G.flags.ending) return;
    if(G.sanity<=0){
        G.flags.ending='madness';
        showEnding('madness');
    }
}

function endingChoose(know){
    closeOverlay();
    if(know==='good'){
        G.flags.ending='good';
        showEnding('good');
    } else {
        G.flags.ending=know?'truth':'deny';
        showEnding(know?'truth':'deny');
    }
}

function showEnding(type){
    const el=$('ending'), title=$('ending-title'), sub=$('ending-sub'), text=$('ending-text');
    el.className='show';

    if(type==='truth'){
        el.classList.add('ending-truth');
        title.textContent='真 相';
        sub.textContent='—— 你终于看到了 ——';
        text.innerHTML=
            `<p>你举起镜子，直视镜中的自己。</p>
            <p>一瞬间，你明白了。</p>
            <p>你才是镜子里的那一个。从一开始就是。</p>
            <p>真正的你——那个在客厅里踟蹰、在卧室里恐惧、在走廊里逃避的你——早已在去年今天的那面镜子里，被替换了。</p>
            <p>你一直以为自己在寻找真相。但真相是：<em>你根本不存在</em>。</p>
            <p>你只是那个在镜中挣扎的倒影。而真正的你……早已离开了这个房间。</p>
            <p style="margin-top:18px;color:#806060;">你放下镜子。世界归于寂静。</p>
            <p style="color:#706050;font-size:12px;margin-top:12px;">在地下室的某个角落，一行你从未注意过的刻字：</p>
            <p style="color:#706050;font-size:14px;letter-spacing:2px;">「唯恐天下不乱，唯恐镜中无我。」</p>`;
        playSting();
    } else if(type==='deny'){
        el.classList.add('ending-deny');
        title.textContent='逃 离';
        sub.textContent='—— 有些事，不知道更好 ——';
        text.innerHTML=
            `<p>你放下镜子，转身离开地下室。</p>
            <p>你决定不去知道答案。有些东西，不知道更好。</p>
            <p>你走上楼梯，穿过走廊，回到客厅。天似乎快亮了——虽然窗外依旧漆黑，但你知道太阳迟早会升起来。</p>
            <p>你把电视关掉。把纸条收好。把一切恢复原样。</p>
            <p>也许明天醒来，一切都会正常。也许你只是做了个噩梦。</p>
            <p>但当你路过走廊尽头的镜子时——你忍不住看了一眼。</p>
            <p>镜中的你也在看你自己。</p>
            <p>它微微笑了一下。</p>
            <p style="margin-top:18px;color:#706050;">你也笑了起来。</p>
            <p style="color:#706050;font-size:13px;">毕竟，你还能去哪里呢？</p>`;
    } else if(type==='good'){
        el.classList.add('ending-truth');
        title.textContent='破 晓';
        sub.textContent='—— 镜子破碎之时 ——';
        text.innerHTML=
            `<p>你握紧那块石头，高高举起。</p>
            <p>镜中的你——那个被困在玻璃另一面的倒影——它<em>没有躲避</em>。它的眼里闪过一丝释然。</p>
            <p>你狠狠砸了下去。</p>
            <p style="font-size:28px;text-align:center;margin:18px 0;letter-spacing:6px;">🔨 哗啦——</p>
            <p>镜子碎裂成千万片。每一片碎片都映着光，每一片里都有一个你——但它们都在<em>微笑</em>。</p>
            <p>一股冰冷的风从破碎的镜框中涌出，带着陈旧的气息。你闭上眼睛。</p>
            <p>当你再次睁开时——</p>
            <p>天亮了。</p>
            <p style="margin:16px 0;">真正的晨光从地下室的窗缝里渗进来，金色的，温暖的，真实的。</p>
            <p>你感受到久违的温暖。你低下头——手里握着的不是石头，而是一面完好的小镜子。镜中你的倒影在<em>对你微笑</em>，和你的动作完全同步。</p>
            <p>你们终于合一了。</p>
            <p style="margin-top:18px;color:#807060;">你走出地下室。走廊不再漫长，客厅不再阴暗。电视关着，安静而祥和。</p>
            <p style="color:#807060;">你打开门，走进了真正的阳光里。</p>
            <p style="color:#706050;font-size:13px;margin-top:16px;letter-spacing:2px;">「唯恐天下不乱，唯恐镜中无我——而今镜已碎，我已在。」</p>`;
        // 好结局播放一段明亮音
        try{
            if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
            const buf=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate);
            const d=buf.getChannelData(0);
            for(let i=0;i<d.length;i++){
                const t=i/AC.sampleRate;
                d[i]=Math.sin(2*Math.PI*262*t)*Math.max(0,1-t/1.2)*.15
                     +Math.sin(2*Math.PI*392*t)*Math.max(0,1-t/1.2)*.1;
            }
            const s=AC.createBufferSource(); s.buffer=buf;
            const g=AC.createGain(); g.gain.value=.2;
            s.connect(g); g.connect(AC.destination); s.start();
        }catch(e){}
    } else if(type==='madness'){
        el.classList.add('ending-mad');
        title.textContent='沉 沦';
        sub.textContent='—— 心神已尽 ——';
        text.innerHTML=
            `<p>你的心神再也支撑不住了。</p>
            <p>恐惧像潮水一样漫上来，淹没了最后一丝清醒。</p>
            <p>你看到墙壁在呼吸。天花板在旋转。影子在角落里聚成人形。</p>
            <p>你听到无数个声音同时在说话——其中有一个是你自己的。</p>
            <p>它说：</p>
            <p style="text-align:center;font-size:18px;color:#806060;letter-spacing:6px;margin:16px 0;">「别怕。你只是醒了。」</p>
            <p>然后一切都安静了。</p>
            <p style="margin-top:18px;color:#706050;font-size:12px;">客厅里，电视机还在沙沙作响。没有人看它。</p>`;
    }

    document.getElementById('game').style.display='none';
}

// ─── 初始化音频 ──────────────────────────────────────
document.addEventListener('click',()=>{ if(!AC) initAudio(); },{once:true});

// ─── 启动 ──────────────────────────────────────────────
renderScene('livingroom');

// 低理智周期性衰减
setInterval(()=>{
    if(G.flags.ending) return;
    G._cd=Math.max(0,G._cd-1);
    if(G.sanity<50 && G.sanity>0 && Math.random()<.08) sanityDown(1);
},3000);

console.log('唯恐 — 微恐ARG | 桌面版');
</script>
</body>
</html>
