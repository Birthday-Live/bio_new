<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⏳ 二十四小时 — 恐怖剧情游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0808;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            overflow-x: hidden;
        }

        /* ===== 噪点 ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03) 0px,
                rgba(0,0,0,0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 100;
            animation: noise 0.5s steps(4) infinite;
        }

        @keyframes noise {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-0.5px, 0.5px); }
            50% { transform: translate(0.5px, -0.5px); }
            75% { transform: translate(-0.5px, -0.5px); }
            100% { transform: translate(0, 0); }
        }

        /* ===== 暗角 ===== */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 99;
        }

        .flicker-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.02);
            pointer-events: none;
            z-index: 98;
            animation: flicker 8s ease-in-out infinite;
        }

        @keyframes flicker {
            0%, 95%, 100% { opacity: 0; }
            96% { opacity: 0.15; }
            97% { opacity: 0; }
            98% { opacity: 0.08; }
        }

        /* ===== 主容器 ===== */
        .game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 620px;
            background: rgba(12, 10, 16, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 32px 34px;
            border: 1px solid rgba(100, 60, 60, 0.15);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(80, 0, 0, 0.03);
        }

        /* ===== 标题栏 ===== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(100, 60, 60, 0.1);
        }

        .game-title {
            color: #b88a8a;
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .game-title span { color: #6a3a3a; }

        .save-indicator {
            font-size: 11px;
            color: #5a4a4a;
            letter-spacing: 1px;
        }

        .save-indicator .saved { color: #6a8a6a; }
        .save-indicator .unsaved { color: #8a5a5a; }

        /* ===== SVG 图标容器 ===== */
        .scene-icon {
            text-align: center;
            margin-bottom: 8px;
            min-height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene-icon svg {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 0 20px rgba(120, 40, 40, 0.12));
            animation: icon-pulse 4s ease-in-out infinite;
        }

        @keyframes icon-pulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(120, 40, 40, 0.08)); }
            50% { filter: drop-shadow(0 0 28px rgba(180, 60, 60, 0.18)); }
        }

        /* 某些场景特殊动画 */
        .scene-icon .glow-red svg {
            filter: drop-shadow(0 0 30px rgba(200, 40, 40, 0.2));
            animation: icon-pulse-red 2s ease-in-out infinite;
        }

        @keyframes icon-pulse-red {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(200, 40, 40, 0.1)); }
            50% { filter: drop-shadow(0 0 35px rgba(200, 40, 40, 0.3)); }
        }

        .scene-icon .glow-blue svg {
            filter: drop-shadow(0 0 30px rgba(40, 80, 200, 0.15));
            animation: icon-pulse-blue 3s ease-in-out infinite;
        }

        @keyframes icon-pulse-blue {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(40, 80, 200, 0.08)); }
            50% { filter: drop-shadow(0 0 35px rgba(40, 80, 200, 0.2)); }
        }

        .scene-icon .glow-gold svg {
            filter: drop-shadow(0 0 30px rgba(200, 160, 60, 0.12));
        }

        .scene-location {
            text-align: center;
            font-size: 12px;
            color: #6a4a4a;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .scene-location::before,
        .scene-location::after { content: ' ▸ '; color: #4a2a2a; }

        /* ===== 剧情文本 ===== */
        .story-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 24px 26px;
            margin-bottom: 22px;
            border-left: 2px solid rgba(120, 50, 50, 0.2);
            min-height: 130px;
            position: relative;
        }

        .story-box p {
            color: #c8b8b8;
            font-size: 15px;
            line-height: 2;
            letter-spacing: 0.3px;
        }

        .story-box p .highlight { color: #d89a9a; font-weight: 500; }
        .story-box p .whisper { color: #7a6a6a; font-style: italic; font-size: 14px; }
        .story-box p .danger { color: #c86060; font-weight: 600; }

        .story-box .divider-dot {
            display: block;
            text-align: center;
            color: #4a2a2a;
            font-size: 12px;
            margin: 12px 0;
            letter-spacing: 6px;
        }

        .glitch-flash { animation: glitchFlash 0.15s ease-out; }

        @keyframes glitchFlash {
            0% { background-color: rgba(180, 40, 40, 0.08); }
            100% { background-color: transparent; }
        }

        /* ===== 选项按钮 ===== */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(120, 70, 70, 0.12);
            border-radius: 14px;
            padding: 14px 20px;
            color: #b8a0a0;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            letter-spacing: 0.3px;
        }

        .choice-btn::before { content: '▸ '; color: #6a3a3a; font-size: 12px; }

        .choice-btn:hover {
            background: rgba(120, 40, 40, 0.08);
            border-color: rgba(180, 80, 80, 0.2);
            transform: translateX(6px);
            color: #d0b0b0;
        }

        .choice-btn:active { transform: translateX(3px) scale(0.99); }

        /* ===== 底部栏 ===== */
        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(100, 60, 60, 0.06);
            font-size: 11px;
            color: #4a3a3a;
        }

        .footer-left { display: flex; gap: 12px; align-items: center; }

        .footer-btn {
            background: none;
            border: 1px solid rgba(100, 60, 60, 0.08);
            border-radius: 20px;
            padding: 5px 14px;
            color: #6a4a4a;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .footer-btn:hover {
            background: rgba(100, 50, 50, 0.06);
            border-color: rgba(140, 80, 80, 0.15);
            color: #9a7a7a;
        }

        .footer-step { letter-spacing: 1px; color: #4a3a3a; }

        /* ===== Toast ===== */
        .save-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10, 8, 12, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 60, 60, 0.15);
            border-radius: 12px;
            padding: 10px 22px;
            color: #8a7a7a;
            font-size: 12px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 200;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== 结局样式 ===== */
        .ending-peace { border-left-color: rgba(100, 120, 100, 0.2); }
        .ending-peace p { color: #b8c8b8; }

        .ending-horror { border-left-color: rgba(180, 40, 40, 0.3); }
        .ending-horror p { color: #d0a0a0; }
        .ending-horror p .highlight { color: #e08080; }

        .ending-mystery { border-left-color: rgba(100, 80, 140, 0.2); }
        .ending-mystery p { color: #c0b8d0; }

        /* ============================================ */
        /*  🚨 免责声明弹窗 */
        /* ============================================ */
        .disclaimer-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: overlayFadeIn 0.6s ease;
        }

        @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .disclaimer-modal {
            background: rgba(14, 12, 20, 0.96);
            border: 1px solid rgba(100, 60, 60, 0.2);
            border-radius: 24px;
            padding: 36px 38px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            animation: modalPop 0.5s ease;
        }

        @keyframes modalPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .disclaimer-modal .icon { font-size: 52px; display: block; margin-bottom: 14px; }

        .disclaimer-modal h2 {
            color: #c8a88a;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        .disclaimer-modal .divider-line {
            width: 60px;
            height: 1px;
            background: rgba(180, 140, 100, 0.15);
            margin: 0 auto 18px auto;
        }

        .disclaimer-modal p {
            color: #a89088;
            font-size: 13px;
            line-height: 2;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .disclaimer-modal .highlight-warn { color: #d4a070; }

        .disclaimer-modal .author-line {
            margin: 20px 0 18px 0;
            padding: 12px 0;
            border-top: 1px solid rgba(180, 140, 100, 0.08);
            border-bottom: 1px solid rgba(180, 140, 100, 0.08);
        }

        .disclaimer-modal .author-line span { color: #8a7a6a; font-size: 13px; letter-spacing: 2px; }
        .disclaimer-modal .author-line .name { color: #c8a890; font-weight: 500; font-size: 14px; }

        .disclaimer-modal .agree-btn {
            background: rgba(180, 120, 80, 0.06);
            border: 1px solid rgba(180, 120, 80, 0.15);
            border-radius: 30px;
            padding: 12px 48px;
            color: #c8a088;
            font-size: 14px;
            font-family: inherit;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
        }

        .disclaimer-modal .agree-btn:hover {
            background: rgba(180, 120, 80, 0.12);
            border-color: rgba(200, 140, 100, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(80, 40, 20, 0.1);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .game-container { padding: 20px 18px; }
            .story-box { padding: 18px 16px; min-height: 110px; }
            .story-box p { font-size: 14px; line-height: 1.9; }
            .choice-btn { padding: 12px 16px; font-size: 13px; }
            .scene-icon svg { width: 52px; height: 52px; }
            .game-header { flex-direction: column; gap: 6px; align-items: flex-start; }
            .disclaimer-modal { padding: 28px 24px; }
            .disclaimer-modal h2 { font-size: 16px; }
            .disclaimer-modal p { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="flicker-overlay"></div>
    <div class="save-toast" id="saveToast">📼 进度已保存</div>

    <!-- ===== 🚨 免责声明 ===== -->
    <div class="disclaimer-overlay" id="disclaimerOverlay">
        <div class="disclaimer-modal">
            <span class="icon">⚠️</span>
            <h2>免责声明</h2>
            <div class="divider-line"></div>
            <p>
                本游戏为 <span class="highlight-warn">虚构剧情作品</span>，<br>
                包含恐怖、悬疑及惊悚元素。<br><br>
                如有心脏病、高血压、精神衰弱等情况，<br>
                请 <span class="highlight-warn">慎重游玩</span>。<br><br>
                所有角色、场景及事件均为虚构，<br>
                如有雷同，纯属巧合。<br><br>
                请合理分配时间，<span class="highlight-warn">不要影响正常生活</span>。
            </p>
            <div class="author-line">
                <span>✧ 作者 ✧</span><br>
                <span class="name">DeepSeek &amp; WaterChisato</span>
            </div>
            <button class="agree-btn" id="disclaimerAgree">我已知晓，开始游戏</button>
        </div>
    </div>

    <!-- ===== 游戏容器 ===== -->
    <div class="game-container" id="app" style="display:none;"></div>

    <script>

            corridor: `

                    { text: '赶紧去四楼', next: 'floor4_gate' },
                    { text: '先去二楼看看', next: 'floor2' }
                ]
            },

            floor2: {
                location: '二楼 · 走廊',
                text: `二楼的走廊比一楼更暗，只有几盏应急灯发出惨淡的绿光。<br><br>走廊两侧的房间门大多敞开着，里面是废弃的病房。墙上贴满了泛白的告示和……<span class="whisper">一些奇怪的涂鸦。</span><br><br>你注意到其中一扇门上用红色的颜料写着：<br><br><span class="danger">「不要进三号房」</span><br><br>而走廊尽头，有一扇半掩着的门，里面透出暖黄色的灯光——和别处都不一样。`,
                choices: [
                    { text: '去暖黄灯光的房间', next: 'warm_room' },
                    { text: '无视警告，推开三号房', next: 'room3' },
                    { text: '直接上三楼', next: 'floor3' }
                ]
            },

            room3: {
                location: '二楼 · 三号房',
                text: `你推开了三号房的门。<br><br>房间里空荡荡的，只有一面镜子——一面巨大的、从地板延伸到天花板的镜子。<br><br>你看向镜子，却看到镜中的自己……在微笑。<br><br>但你并没有在笑。<br><br><span class="danger">镜中的「你」举起一只手，慢慢指向天花板，然后用指甲在镜面上划出一行字：</span><br><br><span class="whisper">「它们在三楼等你。」</span><br><br>灯光猛地熄灭了。`,
                choices: [
                    { text: '冲出房间，跑向三楼！', next: 'floor3' },
                    { text: '回头跑向暖灯光的房间', next: 'warm_room' }
                ]
            },

            warm_room: {
                location: '二楼 · 值班室',
                text: `你走进那个亮着暖黄灯光的房间——这是一间旧值班室。桌上有一盏老式台灯，旁边放着一本摊开的日志。<br><br>日志上潦草地写着：<br><br><span class="whisper">「第7天……它们越来越像人了。今天『它』穿着医生的白大褂，跟所有人打招呼。没人发现异常。除了我。」</span><br><br><span class="whisper">「第9天……我把三样东西藏在了不同的地方。怀表、钥匙、信。如果有人能找到它们——也许就能逃出去。」</span><br><br>日志的最后一行字迹颤抖：<span class="danger">「它们来了。我没有时间了。」</span>`,
                choices: [
                    { text: '带上日志，去三楼', next: 'floor3' },
                    { text: '翻翻抽屉还有没有别的东西', next: 'drawer' }
                ]
            },

            drawer: {
                location: '值班室 · 抽屉',
                text: `你拉开抽屉——里面放着一把老旧的<span class="highlight">手枪</span>，只有一发子弹。<br><br>旁边还有一张工作证，照片上是一个年轻的医生，笑容温和。名字栏写着：<span class="whisper">「林医生 · 精神科」</span>。<br><br>工作证的背面用圆珠笔写着四个字：<span class="highlight">「相信自己」</span>。<br><br><span class="divider-dot">· · ·</span><span class="highlight">【获得：手枪 × 1发】</span>`,
                choices: [
                    { text: '带上枪，去三楼', next: 'floor3' }
                ]
            },

            floor3: {
                location: '三楼 · 手术区',
                text: `三楼的氛围完全不同。空气中弥漫着消毒水的气味，灯光明亮得刺眼——仿佛这里还在正常运转。<br><br>走廊尽头有一扇玻璃门，门上写着「手术室」。玻璃上蒙着一层雾气，看不清里面。<br><br>你听到门后传来金属器械碰撞的声音……<br><br>旁边有一条楼梯继续向上——通往四楼。`,
                choices: [
                    { text: '推开手术室的门', next: 'operation' },
                    { text: '直接上四楼', next: 'floor4_gate' }
                ]
            },

            operation: {
                location: '三楼 · 手术室',
                text: `你推开门——手术室里空无一人。但无影灯还亮着，手术台上躺着一个……和人一模一样的「东西」。<br><br>它的胸腔被打开了，里面没有器官，只有密密麻麻的<span class="whisper">发条和齿轮</span>。<br><br>你震惊地后退一步，撞到了身后的一个人。<br><br>你转过头——一个穿着白大褂的「人」正低头看着你。它的脸上带着标准的微笑，但眼睛……是玻璃做的。<br><br><span class="danger">「你看到了不该看的東西。」</span>`,
                choices: [
                    { text: '开枪！！！（如果有子弹）', next: 'shoot_ending' },
                    { text: '转身拼命跑向四楼！', next: 'floor4_chase' }
                ]
            },

            floor4_gate: {
                location: '四楼 · 上锁的门',
                text: `你来到四楼，走廊尽头有一扇厚重的铁门，门上有一个奇怪的锁孔——它需要三样东西同时验证才能打开。<br><br>锁孔旁边刻着三行小字：<br><br><span class="whisper">「时间之证」 —— 怀表</span><br><span class="whisper">「真相之匙」 —— 钥匙</span><br><span class="whisper">「记忆之信」 —— 信</span><br><br>`,
                choices: function() {
                    if (gameState.inventory.watch && gameState.inventory.key && gameState.inventory.letter) {
                        return [
                            { text: '将三样东西放入锁孔 🔓', next: 'ending_freedom' }
                        ];
                    } else {
                        return [
                            { text: '还缺东西……回去找齐', next: 'floor2' },
                            { text: '强行踹门', next: 'kick_door' }
                        ];
                    }
                }
            },

            kick_door: {
                location: '四楼 · 铁门前',
                text: `你用力踹了几脚门——纹丝不动。<br><br>但巨大的声响引来了……它们。<br><br>走廊两端都传来了整齐的脚步声，整齐得不像是人类。<br><br>你被困在中间了。<br><br><span class="danger">「时间到。」</span>`,
                choices: [],
                isEnding: true,
                endingType: 'horror'
            },

            floor4_chase: {
                location: '四楼 · 追逐中',
                text: `你疯狂地跑上四楼，身后的脚步声紧追不舍。<br><br>铁门就在眼前——你把手伸进口袋……<br><br>`,
                choices: function() {
                    if (gameState.inventory.watch && gameState.inventory.key && gameState.inventory.letter) {
                        return [
                            { text: '把三样东西塞进锁孔！🔓', next: 'ending_freedom' }
                        ];
                    } else {
                        return [
                            { text: '……门没开 😰', next: 'ending_caught' }
                        ];
                    }
                }
            },

            shoot_ending: {
                location: '★ 结局：枪响',
                text: `你举起手枪，对准了那个「东西」。<br><br>它歪着头看你，玻璃眼珠里倒映着你的身影。<br><br><span class="whisper">「你确定……要杀一个『人』吗？」</span><br><br>你的手在颤抖。这可能是你唯一的机会。<br><br>你扣下了扳机。<br><br><span class="danger">——砰！！！</span><br><br>「它」倒下了。但你听到整层楼传来了无数个脚步声——它们全都被惊动了。<br><br>你只有一发子弹。<br><br>铁门就在四楼……但你还有机会跑到那里吗？`,
                choices: [
                    { text: '拼命跑向四楼！', next: 'floor4_chase' }
                ],
                isEnding: false
            },

            ending_freedom: {
                location: '★ 结局：破晓',
                text: `三样东西放入锁孔的瞬间，铁门发出沉闷的咔嗒声。<br><br>你推开门——外面是清晨的阳光、新鲜的空气，和一条通往山下的路。<br><br>你回头看了一眼那栋楼——它在晨光中显得破败而普通，像是什么都没有发生过。<br><br>你手里还握着那块怀表。表盖里，照片上的两个人依然微笑着。<br><br>你忽然想起——那张照片里的人是……林医生和他的妻子。<br><br>而他的妻子，你在二楼的值班室照片上见过——就是那个在角落里对你说话的人影。<br><br><span class="highlight">「她放你走的。」</span><br><br><span class="whisper">🍃 你自由了。但你永远忘不了那二十四个小时。</span>`,
                choices: [],
                isEnding: true,
                endingType: 'peace'
            },

            ending_caught: {
                location: '★ 结局：永夜',
                text: `它们追上了你。<br><br>你被拖回了那间地下室。铁床还在那里，头顶的灯管还在嗡嗡作响。<br><br>你失去了那三样东西。下一次「醒来」会是什么时候？<br><br>也许二十四小时后……也许永远。<br><br><span class="whisper">黑暗中，你又听到了那个沙哑的声音：</span><br><br><span class="danger">「你不该回来的。」</span><br><br><span class="whisper">🌑 游戏结束。你被困在了这二十四小时里。</span>`,
                choices: [],
                isEnding: true,
                endingType: 'horror'
            },

            basement_deep: {
                location: '负二层 · 焚化炉',
                text: `你沿着楼梯向下走去，空气中弥漫着一股焦糊味。<br><br>地下室里有一座废弃的焚化炉，炉门半开着，里面还有没能完全烧尽的骨头碎片。<br><br>旁边堆着一摞病历档案——你随手翻开一本，上面写着：<br><br><span class="whisper">「患者编号 2401……林医生，精神科主治医师。于本院工作第十年出现妄想症状，声称本院工作人员被『非人存在』替换。于当年十二月失踪。」</span><br><br>你手上的病历——是那个「人影」的。`,
                choices: [
                    { text: '带着病历，赶快上去', next: 'floor2' },
                    { text: '再翻翻焚化炉旁边有什么', next: 'burn_find' }
                ]
            },

            burn_find: {
                location: '焚化炉旁',
                text: `你在焚化炉旁边发现了一个被烟熏黑的铁盒——里面有三张照片，和你在怀表里看到的是同一对男女。<br><br>照片背面写着字：<br><br>「第一天 · 我们来到这栋楼」——两人笑着<br>「第三年 · 她说她发现了秘密」——妻子神情忧虑<br>「第五年 · 我失去了她」——只剩林医生一人<br><br><span class="whisper">那个「人影」……是林医生的妻子。</span><br><br>她一直在这里，帮他指引那些被困的人逃出去。`,
                choices: [
                    { text: '带着这些线索，去四楼', next: 'floor4_gate' }
                ]
            }
        };

        // ================================================================
        //  🎮 游戏引擎
        // ================================================================

        let gameState = {
            sceneId: 'start',
            stepCount: 0,
            inventory: { watch: false, key: false, letter: false, gun: false },
            flags: {}
        };

        // ---------- 存档 ----------
        function saveGame() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
                showToast('📼 进度已保存');
                updateSaveIndicator(true);
            } catch (e) { showToast('⚠️ 存档失败'); }
        }

        function loadGame() {
            try {
                const data = localStorage.getItem(SAVE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    gameState = { ...gameState, ...parsed, inventory: { ...gameState.inventory, ...(parsed.inventory || {}) }, flags: { ...(parsed.flags || {}) } };
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function deleteSave() {
            localStorage.removeItem(SAVE_KEY);
            showToast('🗑️ 存档已删除');
            updateSaveIndicator(false);
        }

        function hasSaveData() {
            return localStorage.getItem(SAVE_KEY) !== null;
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('saveToast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        function updateSaveIndicator(saved) {
            const el = document.querySelector('.save-indicator');
            if (el) el.innerHTML = saved ? '<span class="saved">💾 已存档</span>' : '<span class="unsaved">○ 未存档</span>';
        }

        function resetGame() {
            gameState = { sceneId: 'start', stepCount: 0, inventory: { watch: false, key: false, letter: false, gun: false }, flags: {} };
            deleteSave();
            renderScene('start');
        }

        // ---------- 渲染 ----------
        function renderScene(sceneId) {
            const scene = scenes[sceneId];
            if (!scene) { renderScene('start'); return; }

            gameState.sceneId = sceneId;
            gameState.stepCount++;

            // 背包更新
            if (sceneId === 'check_bed') gameState.inventory.watch = true;
            if (sceneId === 'search_debris') { gameState.inventory.key = true; gameState.inventory.letter = true; }
            if (sceneId === 'drawer') gameState.inventory.gun = true;

            // 结局样式
            let endingClass = '';
            if (scene.isEnding) {
                if (scene.endingType === 'peace') endingClass = 'ending-peace';
                else if (scene.endingType === 'horror') endingClass = 'ending-horror';
                else if (scene.endingType === 'mystery') endingClass = 'ending-mystery';
            }

            // 选项
            let choicesHtml = '';
            let choicesList = typeof scene.choices === 'function' ? scene.choices() : scene.choices;
            if (choicesList && choicesList.length > 0) {
                choicesHtml = '<div class="choices">';
                choicesList.forEach(choice => {
                    choicesHtml += `<button class="choice-btn" data-next="${choice.next}">${choice.text}</button>`;
                });
                choicesHtml += '</div>';
            } else if (scene.isEnding) {
                choicesHtml = `<div class="choices"><button class="choice-btn" data-next="start">🔄 轮回 · 重新开始</button></div>`;
            }

            // 背包显示
            const invItems = [];
            if (gameState.inventory.watch) invItems.push('⌚怀表');
            if (gameState.inventory.key) invItems.push('🔑钥匙');
            if (gameState.inventory.letter) invItems.push('✉️信');
            if (gameState.inventory.gun) invItems.push('🔫手枪');
            const invText = invItems.length > 0 ? `🎒 ${invItems.join(' · ')}` : '🎒 空手';

            const stepInfo = scene.isEnding ? '⏹️ 旅程终结' : `⏳ 第 ${gameState.stepCount} / 24 小时`;

            // ---- SVG 图标 ----
            const { svg, glowClass } = getSceneIcon(sceneId);

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="game-header">
                    <div class="game-title">⏳ <span>二十四小时</span></div>
                    <div class="save-indicator">○ 未存档</div>
                </div>

                <div class="scene-icon ${glowClass}">${svg}</div>
                <div class="scene-location">${scene.location}</div>

                <div class="story-box ${endingClass}"><p>${scene.text}</p></div>

                <div class="choices">${choicesHtml}</div>

                <div class="game-footer">
                    <div class="footer-left">
                        <span class="footer-step">${stepInfo}</span>
                        <button class="footer-btn" id="saveBtn">💾 存档</button>
                        <button class="footer-btn" id="loadBtn">📂 读档</button>
                    </div>
                    <div><button class="footer-btn" id="resetBtn">🗑️ 重置</button></div>
                </div>

                <div style="text-align:center;margin-top:10px;font-size:11px;color:#3a2a2a;letter-spacing:1px;">${invText}</div>
            `;

            app.style.display = 'block';
            updateSaveIndicator(hasSaveData());

            // 绑定事件
            document.querySelectorAll('.choice-btn[data-next]').forEach(btn => {
                btn.addEventListener('click', () => renderScene(btn.getAttribute('data-next')));
            });
            document.getElementById('saveBtn').addEventListener('click', saveGame);
            document.getElementById('loadBtn').addEventListener('click', () => {
                if (loadGame()) { showToast('📂 读取成功'); renderScene(gameState.sceneId); }
                else { showToast('⚠️ 没有存档'); }
            });
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (confirm('确定要重置所有进度吗？')) resetGame();
            });

            if (!scene.isEnding) {
                try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); } catch(e) {}
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (sceneId === 'jar_scare' || sceneId === 'room3') {
                const container = document.querySelector('.game-container');
                container.classList.add('glitch-flash');
                setTimeout(() => container.classList.remove('glitch-flash'), 300);
            }
        }

        // ================================================================
        //  🚀 启动
        // ================================================================

        const disclaimerOverlay = document.getElementById('disclaimerOverlay');
        document.getElementById('disclaimerAgree').addEventListener('click', () => {
            disclaimerOverlay.style.opacity = '0';
            disclaimerOverlay.style.transition = 'opacity 0.6s ease';
            setTimeout(() => {
                disclaimerOverlay.style.display = 'none';
                if (hasSaveData()) {
                    if (confirm('📂 检测到之前的游戏进度，是否读取存档？\n（取消将从头开始）')) {
                        loadGame();
                    } else {
                        deleteSave();
                    }
                }
                renderScene(gameState.sceneId);
            }, 600);
        });
    </script>
</body>
</html>
