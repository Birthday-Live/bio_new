<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友链 - About WaterChisato</title>

    <meta property="og:title" content="友链 - About WaterChisato">
    <meta property="og:description" content="感谢每一位愿意和我交换链接的朋友～">
    <meta property="og:type" content="website">

    <!-- 字体 & 图标 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/harmonyos-sans@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-symbols@latest/outlined.css">

    
    <!-- Claude 风格主题 -->
    <style>
        :root {
            /* Claude 配色：Pampas / Ivory / Oat / Clay / Slate / Stone */
            --cl-bg: #F4F3EE;
            --cl-surface: #FAF9F5;
            --cl-border: #E3DACC;
            --cl-ink: #141413;
            --cl-muted: #5E5D59;
            --cl-faint: #87867F;
            --cl-accent: #C96442;
            --cl-accent-soft: #F0E4DC;
            --cl-serif: "Lora", Georgia, "Noto Serif SC", "Songti SC", serif;
            --cl-sans: "HarmonyOS Sans SC", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --cl-bg: #262624;
                --cl-surface: #30302E;
                --cl-border: #444442;
                --cl-ink: #FAF9F5;
                --cl-muted: #C2C0B6;
                --cl-faint: #87867F;
                --cl-accent: #D97757;
                --cl-accent-soft: #3A2E28;
            }
        }

        html,
        body {
            background: var(--cl-bg) !important;
            color: var(--cl-ink);
            font-family: var(--cl-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* 隐藏原来的背景图层 */
        .fallback-bg,
        #bg-canvas,
        #bg-canvas-back {
            display: none !important;
        }

        .friend-page .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 56px 20px 48px;
        }

        /* ---------- 头部 ---------- */
        .friend-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .friend-header .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--cl-border);
            box-shadow: 0 2px 8px rgba(20, 20, 19, .06);
        }

        .friend-header .centered {
            margin: 16px 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--cl-accent);
        }

        .friend-header h1 {
            margin: 0 0 12px;
            font-family: var(--cl-serif);
            font-size: 40px;
            font-weight: 500;
            letter-spacing: -.01em;
            color: var(--cl-ink);
        }

        .friend-header .bio {
            margin: 0 0 28px;
            font-size: 17px;
            color: var(--cl-muted);
        }

        /* ---------- 工具栏 ---------- */
        .friend-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .friend-count {
            font-size: 14px;
            color: var(--cl-muted);
        }

        .friend-count b {
            color: var(--cl-accent);
            font-weight: 600;
        }

        .friend-search {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 240px;
            max-width: 360px;
            min-width: 240px;
            padding: 8px 16px;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 999px;
            transition: border-color .2s, box-shadow .2s;
        }

        .friend-search:focus-within {
            border-color: var(--cl-accent);
            box-shadow: 0 0 0 3px var(--cl-accent-soft);
        }

        .friend-search .material-symbols-outlined {
            font-size: 20px;
            color: var(--cl-faint);
        }

        .friend-search input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            font: inherit;
            font-size: 15px;
            color: var(--cl-ink);
        }

        .friend-search input::placeholder {
            color: var(--cl-faint);
        }

        /* ---------- 卡片网格 ---------- */
        .friend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 32px;
        }

        .friend-card {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 16px;
            color: inherit;
            text-decoration: none;
            animation: cl-rise .4s ease both;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }

        .friend-card:hover {
            transform: translateY(-2px);
            border-color: var(--cl-accent);
            box-shadow: 0 8px 24px rgba(20, 20, 19, .06);
        }

        @keyframes cl-rise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        .friend-avatar {
            position: relative;
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 12px;
            background: var(--cl-accent-soft);
            color: var(--cl-accent);
            font-family: var(--cl-serif);
            font-size: 18px;
            font-weight: 500;
        }

        .friend-avatar img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .friend-main {
            flex: 1;
            min-width: 0;
        }

        .friend-title {
            overflow: hidden;
            font-family: var(--cl-serif);
            font-size: 17px;
            font-weight: 500;
            color: var(--cl-ink);
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .friend-desc {
            display: -webkit-box;
            margin-top: 4px;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.55;
            color: var(--cl-muted);
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .friend-host {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--cl-faint);
        }

        .friend-host .material-symbols-outlined {
            font-size: 14px;
        }

        .friend-arrow {
            font-size: 18px;
            color: var(--cl-faint);
            transition: color .2s, transform .2s;
        }

        .friend-card:hover .friend-arrow {
            color: var(--cl-accent);
            transform: translate(2px, -2px);
        }

        /* ---------- 提示 / 空状态 ---------- */
        .friend-notice {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--cl-muted);
            background: var(--cl-surface);
            border: 1px dashed var(--cl-border);
            border-radius: 16px;
        }

        .friend-notice .material-symbols-outlined {
            color: var(--cl-accent);
        }

        .friend-notice code {
            padding: 1px 6px;
            font-size: 13px;
            color: var(--cl-accent);
            background: var(--cl-accent-soft);
            border-radius: 6px;
        }

        /* ---------- 骨架屏 ---------- */
        .friend-skeleton .friend-card {
            pointer-events: none;
            animation: none;
        }

        .sk-line {
            border-radius: 6px;
            background: linear-gradient(90deg, var(--cl-border) 25%, var(--cl-bg) 50%, var(--cl-border) 75%);
            background-size: 200% 100%;
            animation: cl-shimmer 1.4s infinite;
        }

        @keyframes cl-shimmer {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }

        .sk-avatar {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .sk-title {
            width: 60%;
            height: 16px;
            margin-bottom: 10px;
        }

        .sk-desc {
            width: 90%;
            height: 12px;
        }

        /* ---------- 页脚 ---------- */
        .site-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 56px;
            text-align: center;
        }

        .site-footer .link-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--cl-ink);
            text-decoration: none;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 999px;
            transition: border-color .2s, color .2s;
        }

        .site-footer .link-card:hover {
            color: var(--cl-accent);
            border-color: var(--cl-accent);
        }

        .site-footer .link-text {
            font-size: 15px;
            font-weight: 500;
        }

        .friend-apply {
            font-size: 14px;
            color: var(--cl-muted);
        }

        .friend-apply a {
            color: var(--cl-accent);
            text-decoration: none;
            border-bottom: 1px solid currentColor;
        }

        @media (max-width: 600px) {
            .friend-header h1 {
                font-size: 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

</body>
