<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友链 - About WaterChisato</title>

    <meta property="og:title" content="友链 - About WaterChisato">
    <meta property="og:description" content="感谢每一位愿意和我交换链接的朋友～">
    <meta property="og:type" content="website">

    <!-- 首帧前标记 JS 可用，避免禁用 JS 时页面永远不可见 -->
    <script>document.documentElement.classList.add('js');</script>

    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/harmonyos-sans@5/index.css">
    <!-- 保留图标字体：friend.js 渲染卡片时使用 material-symbols-outlined -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-symbols@latest/outlined.css">

    <style>
        :root {
            /* Claude 配色：Pampas / Ivory / Oat / Clay / Slate / Stone */
            --cl-bg: #F4F3EE;
            --cl-surface: #FAF9F5;
            --cl-border: #E3DACC;
            --cl-ink: #141413;
            --cl-muted: #5E5D59;
            --cl-faint: #87867F;
            --cl-accent: #C96442;
            --cl-accent-soft: #F0E4DC;
            --cl-serif: "Lora", Georgia, "Noto Serif SC", "Songti SC", serif;
            --cl-sans: "HarmonyOS Sans SC", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --cl-glass: rgba(250, 249, 245, .55);
            --cl-glass-border: rgba(255, 255, 255, .55);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --cl-bg: #262624;
                --cl-surface: #30302E;
                --cl-border: #444442;
                --cl-ink: #FAF9F5;
                --cl-muted: #C2C0B6;
                --cl-faint: #87867F;
                --cl-accent: #D97757;
                --cl-accent-soft: #3A2E28;
                --cl-glass: rgba(48, 48, 46, .45);
                --cl-glass-border: rgba(255, 255, 255, .12);
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--cl-bg);
            color: var(--cl-ink);
            font-family: var(--cl-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 进出场动画 ================= */
        html.js body.friend-page {
            opacity: 0;
        }

        html.js body.friend-page.is-ready {
            opacity: 1;
            transition: opacity .5s ease;
        }

        html.js body.friend-page.is-leaving {
            opacity: 0;
            transition: opacity .26s ease;
        }

        html.js body.friend-page.is-leaving .container {
            transform: translateY(-10px);
            transition: transform .26s ease;
        }

        .friend-page .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 64px 20px 48px;
        }

        /* ================= 磨砂返回键 ================= */
        .back-fab {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            color: var(--cl-ink);
            text-decoration: none;
            background: var(--cl-glass);
            border: 1px solid var(--cl-glass-border);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 4px 18px rgba(20, 20, 19, .08), inset 0 1px 0 rgba(255, 255, 255, .28);
            transition: transform .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .back-fab:hover {
            color: var(--cl-accent);
            border-color: var(--cl-accent);
            transform: translateX(-2px);
            box-shadow: 0 8px 24px rgba(20, 20, 19, .12), inset 0 1px 0 rgba(255, 255, 255, .3);
        }

        .back-fab:active {
            transform: translateX(-1px) scale(.96);
        }

        .back-fab svg {
            display: block;
        }

        /* ================= 头部 ================= */
        .friend-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .friend-header .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--cl-border);
            box-shadow: 0 2px 8px rgba(20, 20, 19, .06);
        }

        .friend-header .centered {
            margin: 16px 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--cl-accent);
        }

        .friend-header h1 {
            margin: 0 0 12px;
            font-family: var(--cl-serif);
            font-size: 40px;
            font-weight: 500;
            letter-spacing: -.01em;
            color: var(--cl-ink);
        }

        .friend-header .bio {
            margin: 0 0 28px;
            font-size: 17px;
            color: var(--cl-muted);
        }

        /* ================= 工具栏 ================= */
        .friend-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .friend-count {
            font-size: 14px;
            color: var(--cl-muted);
        }

        .friend-count b {
            color: var(--cl-accent);
            font-weight: 600;
        }

        .friend-search {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 240px;
            max-width: 360px;
            min-width: 240px;
            padding: 8px 16px;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 999px;
            transition: border-color .2s, box-shadow .2s;
        }

        .friend-search:focus-within {
            border-color: var(--cl-accent);
            box-shadow: 0 0 0 3px var(--cl-accent-soft);
        }

        .friend-search > svg {
            flex: 0 0 auto;
            color: var(--cl-faint);
        }

        .friend-search input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            font: inherit;
            font-size: 15px;
            color: var(--cl-ink);
        }

        .friend-search input::placeholder {
            color: var(--cl-faint);
        }

        /* ================= 卡片网格 ================= */
        .friend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 32px;
        }

        /*
         * 卡片入场：friend.js 会给每个卡片写入 inline 的 animation-delay，
         * 这里只定义动画本体，delay 交给 JS 控制，互不打架。
         */
        .friend-card {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px;
            background: var(--cl-surface);
            border: 1px solid var(--cl-border);
            border-radius: 16px;
            color: inherit;
            text-decoration: none;
            animation: cl-rise .45s cubic-bezier(.22, .8, .28, 1) both;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }

        .friend-card:hover {
            transform: translateY(-2px);
            border-color: var(--cl-accent);
            box-shadow: 0 8px 24px rgba(20, 20, 19, .06);
        }

        @keyframes cl-rise {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .friend-avatar {
            position: relative;
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 12px;
            background: var(--cl-accent-soft);
            color: var(--cl-accent);
            font-family: var(--cl-serif);
            font-size: 18px;
            font-weight: 500;
        }

        .friend-avatar img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .friend-main {
            flex: 1;
            min-width: 0;
        }

        .friend-title {
            overflow: hidden;
            font-family: var(--cl-serif);
            font-size: 17px;
            font-weight: 500;
            color: var(--cl-ink);
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .friend-desc {
            display: -webkit-box;
            margin-top: 4px;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.55;
            color: var(--cl-muted);
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .friend-host {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--cl-faint);
        }

        .friend-host .material-symbols-outlined {
            font-size: 14px;
        }

        .friend-arrow {
            font-size: 18px;
            color: var(--cl-faint);
            transition: color .2s, transform .2s;
        }

        .friend-card:hover .friend-arrow {
            color: var(--cl-accent);
            transform: translate(2px, -2px);
        }

        /* ================= 提示 / 空状态 ================= */
        .friend-notice {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--cl-muted);
            background: var(--cl-surface);
            border: 1px dashed var(--cl-border);
            border-radius: 16px;
        }

        .friend-notice .material-symbols-outlined {
            color: var(--cl-accent);
        }

        .friend-notice code {
            padding: 1px 6px;
            font-size: 13px;
            color: var(--cl-accent);
            background: var(--cl-accent-soft);
            border-radius: 6px;
        }

        /* ================= 骨架屏 ================= */
        .friend-skeleton .friend-card {
            pointer-events: none;
            animation: none;
        }

        .sk-line {
            border-radius: 6px;
            background: linear-gradient(90deg, var(--cl-border) 25%, var(--cl-bg) 50%, var(--cl-border) 75%);
            background-size: 200% 100%;
            animation: cl-shimmer 1.4s infinite;
        }

        @keyframes cl-shimmer {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        .sk-avatar {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .sk-title {
            width: 60%;
            height: 16px;
            margin-bottom: 10px;
        }

        .sk-desc {
            width: 90%;
            height: 12px;
        }

        /* ================= 页脚 ================= */
        .site-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 56px;
            text-align: center;
        }

        /* 磨砂「添加友链」按钮 */
        .apply-card {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            font-size: 15px;
            font-weight: 500;
            color: var(--cl-ink);
            text-decoration: none;
            background: var(--cl-glass);
            border: 1px solid var(--cl-glass-border);
            border-radius: 999px;
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 4px 18px rgba(20, 20, 19, .07), inset 0 1px 0 rgba(255, 255, 255, .28);
            transition: transform .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .apply-card:hover {
            color: var(--cl-accent);
            border-color: var(--cl-accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(20, 20, 19, .12), inset 0 1px 0 rgba(255, 255, 255, .3);
        }

        .apply-card:active {
            transform: translateY(0) scale(.98);
        }

        .apply-card svg {
            display: block;
        }

        .apply-card .apply-arrow {
            transition: transform .2s ease;
        }

        .apply-card:hover .apply-arrow {
            transform: translateX(3px);
        }

        .friend-tip {
            margin: 0;
            font-size: 13px;
            color: var(--cl-faint);
        }

        @media (max-width: 600px) {
            .friend-header h1 {
                font-size: 32px;
            }

            .friend-page .container {
                padding-top: 76px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            html.js body.friend-page {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="friend-page no-bg-controls">

    <!-- 磨砂返回键：点击回 https://chisato.org.cn -->
    <a class="back-fab" href="https://chisato.org.cn" aria-label="返回首页" title="返回首页">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 5 7.5 12l7 7" />
        </svg>
    </a>

    <main class="container">

        <header class="friend-header">
            <img src="../assets/avatar.png" class="avatar" alt="User">
            <p class="centered">Friends</p>
            <h1>友情链接</h1>
            <p class="bio">感谢每一位愿意和我交换链接的朋友～</p>

            <div class="friend-toolbar">
                <div class="friend-count" id="friend-count">加载中…</div>
                <label class="friend-search">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5" />
                        <path d="m16.2 16.2 3.8 3.8" />
                    </svg>
                    <input type="search" id="friend-search" placeholder="搜索名字 / 简介 / 域名" autocomplete="off">
                </label>
            </div>
        </header>

        <!-- 骨架屏：friend.js 会在加载慢时取消 hidden，数据到位后整块移除 -->
        <section class="friend-grid friend-skeleton" id="friend-skeleton" aria-hidden="true" hidden>
            <div class="friend-card">
                <div class="sk-line sk-avatar"></div>
                <div class="friend-main">
                    <div class="sk-line sk-title"></div>
                    <div class="sk-line sk-desc"></div>
                </div>
            </div>
            <div class="friend-card">
                <div class="sk-line sk-avatar"></div>
                <div class="friend-main">
                    <div class="sk-line sk-title"></div>
                    <div class="sk-line sk-desc"></div>
                </div>
            </div>
            <div class="friend-card">
                <div class="sk-line sk-avatar"></div>
                <div class="friend-main">
                    <div class="sk-line sk-title"></div>
                    <div class="sk-line sk-desc"></div>
                </div>
            </div>
        </section>

        <!-- 友链卡片渲染区：friend.js 的 paint() 会往这里写 innerHTML -->
        <section class="friend-grid" id="friend-grid" aria-live="polite"></section>

        <footer class="site-footer">
            <!-- 原邮件文字改为「添加友链」磨砂按钮 -->
            <a class="apply-card" href="https://chisato.org.cn/friend/apply">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5.5v13M5.5 12h13" />
                </svg>
                <span>添加友链</span>
                <svg class="apply-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5" />
                </svg>
            </a>
            <p class="friend-tip">欢迎每一位朋友～</p>
        </footer>

    </main>

    <script src="friend.js"></script>

    <script>
        (function () {
            var body = document.body;
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ---------- 1. 进入动画 ---------- */
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    body.classList.add('is-ready');
                });
            });

            /* ---------- 2. 离开动画 ----------
             * 只拦截「当前页跳转」的链接；
             * friend.js 渲染的卡片带 target="_blank"，会自然放过，不影响新标签打开。
             */
            var leaving = false;

            function leaveTo(href) {
                if (leaving) return;
                leaving = true;
                body.classList.add('is-leaving');
                setTimeout(function () {
                    window.location.href = href;
                }, reduceMotion ? 0 : 260);
            }

            document.addEventListener('click', function (e) {
                if (e.defaultPrevented || e.button !== 0) return;
                if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

                var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!a) return;

                var href = a.getAttribute('href');
                if (!href || href.charAt(0) === '#' || /^javascript:/i.test(href)) return;
                if (a.target && a.target !== '_self') return;
                if (a.hasAttribute('download')) return;

                e.preventDefault();
                leaveTo(a.href);
            }, false);

            /* ---------- 3. 浏览器后退缓存时恢复状态 ---------- */
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) {
                    leaving = false;
                    body.classList.remove('is-leaving');
                    body.classList.add('is-ready');
                }
            });
        })();
    </script>
</body>

</html>
