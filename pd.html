<style>
  :root {
    --accent-btn-color: #2AABEE;
    --tme-logo-color: #222;
    --card-bg: #fff;
    --card-bg-secondary: #f4f4f5;
    --text-primary: #222;
    --text-secondary: #8E8E93;
    --text-muted: #B0B0B5;
    --border-color: #E5E5EA;
    --shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    --radius: 20px;
    --btn-radius: 30px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .theme_dark {
    --accent-btn-color: #2AABEE;
    --tme-logo-color: #fff;
    --card-bg: #1c1c1e;
    --card-bg-secondary: #2c2c2e;
    --text-primary: #f5f5f5;
    --text-secondary: #98989e;
    --text-muted: #636366;
    --border-color: #38383a;
    --shadow: 0 4px 24px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
    --shadow-hover: 0 8px 40px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.25);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--card-bg-secondary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background var(--transition);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Animated background canvas */
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.6;
    pointer-events: none;
  }

  .theme_dark #bg-canvas {
    opacity: 0.35;
  }

  /* Card */
  .card {
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 420px;
    padding: 40px 32px 32px;
    text-align: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all var(--transition);
    border: 1px solid transparent;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
  }

  .theme_dark .card {
    border-color: var(--border-color);
    background: rgba(28,28,30,0.92);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .logo-wrap svg {
    width: 100px;
    height: auto;
  }

  /* Avatar */
  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: block;
    object-fit: cover;
    border: 3px solid var(--card-bg);
    box-shadow: 0 0 0 1px var(--border-color), 0 4px 16px rgba(0,0,0,0.1);
    transition: transform var(--transition);
    background: var(--card-bg-secondary);
  }

  .avatar:hover {
    transform: scale(1.05);
  }

  /* Channel name */
  .channel-name {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
    letter-spacing: -0.3px;
    line-height: 1.3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .channel-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .channel-badge svg {
    display: block;
  }

  /* Username */
  .username {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    font-weight: 400;
  }

  .username a {
    color: var(--accent-btn-color);
    text-decoration: none;
  }

  .username a:hover {
    text-decoration: underline;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border-color);
    margin: 16px 0;
  }

  /* Description */
  .description {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 20px;
    padding: 0 4px;
  }

  /* Stats row */
  .stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 20px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: var(--btn-radius);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all var(--transition);
    border: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--accent-btn-color);
    color: #fff;
    box-shadow: 0 4px 16px rgba(42, 171, 238, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(42, 171, 238, 0.4);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(42, 171, 238, 0.25);
  }

  .btn-secondary {
    background: transparent;
    color: var(--accent-btn-color);
    border: 1.5px solid var(--border-color);
  }

  .btn-secondary:hover {
    background: var(--card-bg-secondary);
    border-color: var(--accent-btn-color);
  }

  .btn-secondary:active {
    transform: scale(0.98);
  }

  .btn-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* Footer */
  .footer {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
  }

  .footer a {
    color: var(--accent-btn-color);
    text-decoration: none;
  }

  /* Ripple effect */
  .btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to {
      transform: scale(4);
      opacity: 0;
    }
  }

  /* Loading spinner for button */
  .btn-loading {
    pointer-events: none;
    opacity: 0.8;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    body {
      padding: 12px;
      align-items: flex-start;
      padding-top: 48px;
    }
    .card {
      padding: 32px 20px 24px;
      border-radius: 16px;
    }
    .channel-name {
      font-size: 20px;
    }
    .avatar {
      width: 72px;
      height: 72px;
    }
    .stats {
      gap: 16px;
    }
  }

  @media (max-width: 360px) {
    .card {
      padding: 24px 16px 20px;
    }
    .btn {
      font-size: 15px;
      padding: 12px 20px;
    }
  }

  /* Dark mode transition helper */
  .theme-transition,
  .theme_transition * {
    transition: all 0.3s ease !important;
  }

  /* Entry animation */
  .card {
    animation: cardEntry 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0;
    transform: translateY(24px) scale(0.96);
  }

  @keyframes cardEntry {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card > * {
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .card .logo-wrap { animation-delay: 0.1s; }
  .card .avatar { animation-delay: 0.15s; }
  .card .channel-name { animation-delay: 0.2s; }
  .card .username { animation-delay: 0.25s; }
  .card .divider { animation-delay: 0.3s; }
  .card .description { animation-delay: 0.3s; }
  .card .stats { animation-delay: 0.35s; }
  .card .btn-group { animation-delay: 0.4s; }
  .card .footer { animation-delay: 0.45s; }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>

// ============================================================
// Initialize everything
// ============================================================
(function() {
  var canvas = document.getElementById('bg-canvas');

  // Make canvas full screen
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (window.tw) {
      window.tw.update();
    }
  }

  window.addEventListener('resize', resizeCanvas);

  // Init TWallpaper
  window.tw = TWallpaper;
  tw.init(canvas);
  resizeCanvas();

  // Start animation
  tw.animate(true);

  // Auto-scroll animation
  tw.scrollAnimate(true);

  // Cycle through positions periodically
  setInterval(function() {
    tw.toNextPosition();
  }, 6000);

  // ---- Ripple effect on buttons ----
  document.querySelectorAll('.btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      var rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var size = Math.max(rect.width, rect.height) * 2;
      var ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (x - size / 2) + 'px';
      ripple.style.top = (y - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(function() { ripple.remove(); }, 600);
    });
  });

  // ---- Open in Telegram button with fallback ----
  var openBtn = document.getElementById('openBtn');
  if (openBtn) {
    openBtn.addEventListener('click', function(e) {
      // Try to open tg:// scheme
      var tgUrl = 'tg:resolve?domain=WaterChisato';
      var webUrl = 'https://telegram.me/s/WaterChisato';

      // For mobile devices, use tg:// directly
      // For desktop without Telegram, fallback to web
      var isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);

      if (!isMobile) {
        // On desktop, try tg:// with a timeout fallback
        e.preventDefault();
        var btn = this;
        btn.classList.add('btn-loading');
        btn.innerHTML = '<span class="spinner"></span> 打开中…';

        var start = Date.now();
        var win = window.open(tgUrl, '_blank');

        setTimeout(function() {
          // If after 1.5s the window is still on our domain, redirect to web
          try {
            if (win && !win.closed) {
              win.close();
            }
          } catch(e) {}
          window.location.href = webUrl;
        }, 1500);
      }
      // On mobile, default action (href="tg:...") works fine
    });
  }

  var darkMq = window.matchMedia('(prefers-color-scheme: dark)');

    if (e.matches) {

      document.documentElement.classList.remove('theme_dark');
